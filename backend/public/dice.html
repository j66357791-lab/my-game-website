<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸运骰子 - 天创游戏平台</title>
    
    <!-- 强制云端模式配置 -->
    <meta name="force-cloud-mode" content="true">
    <meta name="api-server" content="https://tianchuang.onrender.com">
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #FF7043;
            --secondary: #FFB74D;
            --accent: #FFC107;
            --bg-dark: #2C3E50;
            --bg-light: #34495E;
            --text-light: #ECF0F1;
            --gradient: linear-gradient(135deg, #FF7043, #FFB74D, #FFC107);
            --shadow: 0 8px 25px rgba(255, 112, 67, 0.3);
            --transition: all 0.3s ease;
            --border-radius: 20px;
        }
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d1b1b 50%, #0f0f0f 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        /* 恐怖背景 - 同步主页 */
        .horror-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(139, 0, 0, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(75, 0, 130, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(255, 0, 0, 0.2) 0%, transparent 50%);
            animation: horrorPulse 4s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        
        @keyframes horrorPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }
        
        /* 闪电效果 */
        .lightning {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0);
            pointer-events: none;
            z-index: 100;
        }
        
        .lightning.flash {
            animation: lightningFlash 0.3s ease-out;
        }
        
        @keyframes lightningFlash {
            0% { background: rgba(255, 255, 255, 0); }
            50% { background: rgba(255, 255, 255, 0.8); }
            100% { background: rgba(255, 255, 255, 0); }
        }
        
        /* 动态背景粒子 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--gradient);
            border-radius: 50%;
            opacity: 0.6;
            animation: particleFloat 20s linear infinite;
        }
        
        .particle.interactive {
            width: 6px;
            height: 6px;
            opacity: 0.8;
            animation: particleFloat 15s linear infinite;
        }
        
        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-10vh) rotate(720deg);
                opacity: 0;
            }
        }
        
        /* 娱乐性背景元素 */
        .bg-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }
        
        .bg-element {
            position: absolute;
            font-size: 2rem;
            opacity: 0.1;
            animation: bgFloat 25s linear infinite;
        }
        
        @keyframes bgFloat {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.1;
            }
            90% {
                opacity: 0.1;
            }
            100% {
                transform: translateY(-10vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* 导航栏 */
        .header {
            background: rgba(44, 62, 80, 0.95);
            backdrop-filter: blur(20px);
            padding: 1.5rem 2rem;
            border-radius: var(--border-radius);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 100;
            border: 1px solid rgba(255, 0, 0, 0.3);
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        
        .user-avatar {
            width: 50px;
            height: 50px;
            background: var(--gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.3rem;
            box-shadow: var(--shadow);
            animation: avatarGlow 3s ease-in-out infinite;
        }
        
        @keyframes avatarGlow {
            0%, 100% {
                box-shadow: 0 0 20px rgba(255, 112, 67, 0.5);
            }
            50% {
                box-shadow: 0 0 30px rgba(255, 112, 67, 0.8);
            }
        }
        
        .user-details {
            display: flex;
            flex-direction: column;
        }
        
        .user-name {
            font-weight: 600;
            color: white;
            font-size: 1.1rem;
        }
        
        .user-points {
            background: var(--gradient);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 15px;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(255, 112, 67, 0.3);
        }
        
        .user-dropdown {
            position: relative;
        }
        
        .user-dropdown-menu {
            position: absolute;
            top: 100%;
            right: 0;
            background: rgba(44, 62, 80, 0.95);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 112, 67, 0.3);
            border-radius: 15px;
            padding: 1rem;
            margin-top: 0.5rem;
            min-width: 200px;
            box-shadow: var(--shadow);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: var(--transition);
            z-index: 1001;
        }
        
        .user-dropdown.active .user-dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        
        .user-dropdown-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            transition: var(--transition);
            cursor: pointer;
            color: var(--text-light);
            text-decoration: none;
        }
        
        .user-dropdown-item:hover {
            background: rgba(255, 112, 67, 0.1);
        }
        
        .user-dropdown-divider {
            height: 1px;
            background: rgba(255, 112, 67, 0.3);
            margin: 0.5rem 0;
        }
        
        .back-btn {
            background: linear-gradient(135deg, #6c757d, #5a6268);
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(108, 117, 125, 0.3);
        }
        
        /* 主容器 */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }
        
        /* 游戏容器 */
        .game-container {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border-radius: var(--border-radius);
            padding: 3rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
            position: relative;
            z-index: 10;
            overflow: hidden;
            border: 2px solid rgba(255, 0, 0, 0.3);
        }
        
        .game-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--gradient);
            opacity: 0.05;
            z-index: -1;
        }
        
        .game-title {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 900;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
            animation: titleGlow 3s ease-in-out infinite;
            text-shadow: 0 3px 6px rgba(255, 0, 0, 0.5);
        }
        
        @keyframes titleGlow {
            0%, 100% {
                text-shadow: 0 3px 6px rgba(255, 0, 0, 0.5);
            }
            50% {
                text-shadow: 0 3px 15px rgba(255, 0, 0, 0.8);
            }
        }
        
        /* 游戏设置区域 */
        .game-settings {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: var(--border-radius);
            border: 2px solid rgba(255, 112, 67, 0.3);
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
        }
        
        .game-settings::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--gradient);
            opacity: 0.05;
            z-index: -1;
        }
        
        .settings-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }
        
        .setting-item {
            text-align: center;
        }
        
        .setting-label {
            color: white;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }
        
        .setting-value {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 112, 67, 0.3);
            border-radius: 10px;
            padding: 0.75rem;
            color: white;
            font-size: 1rem;
            text-align: center;
        }
        
        .rounds-selector {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }
        
        .rounds-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 112, 67, 0.3);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
        }
        
        .rounds-btn:hover {
            background: rgba(255, 112, 67, 0.2);
        }
        
        .rounds-btn.active {
            background: var(--gradient);
            border-color: var(--primary);
        }
        
        .play-btn {
            background: var(--gradient);
            color: white;
            border: none;
            padding: 1rem 3rem;
            border-radius: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        
        .play-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }
        
        .play-btn:hover::before {
            left: 100%;
        }
        
        .play-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: var(--shadow);
        }
        
        .play-btn:disabled {
            background: linear-gradient(135deg, #6c757d, #5a6268);
            cursor: not-allowed;
            transform: none;
        }
        
        /* 游戏区域 */
        .game-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            margin-bottom: 3rem;
        }
        
        /* 骰子区域 */
        .dice-section {
            text-align: center;
            position: relative;
        }
        
        .dice-container {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 2rem 0;
            position: relative;
            perspective: 1000px;
        }
        
        .dice {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #e67e22, #d35400);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            color: white;
            box-shadow: 0 20px 40px rgba(230, 126, 34, 0.4);
            transition: all 0.3s ease;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
        }
        
        .dice::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background: linear-gradient(45deg, #FFD700, #FFA500, #FF69B4, #FF1493);
            border-radius: 20px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .dice:hover::before {
            opacity: 0.6;
        }
        
        .dice.rolling {
            animation: rollDice 1.5s ease-in-out;
        }
        
        @keyframes rollDice {
            0% { 
                transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); 
            }
            25% { 
                transform: rotateX(180deg) rotateY(90deg) rotateZ(90deg); 
            }
            50% { 
                transform: rotateX(360deg) rotateY(180deg) rotateZ(180deg); 
            }
            75% { 
                transform: rotateX(540deg) rotateY(270deg) rotateZ(270deg); 
            }
            100% { 
                transform: rotateX(720deg) rotateY(360deg) rotateZ(360deg); 
            }
        }
        
        .round-result {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 112, 67, 0.3);
            border-radius: 15px;
            padding: 1rem;
            margin: 1rem 0;
            color: white;
            font-weight: 600;
        }
        
        .round-result.win {
            border-color: #28a745;
            background: rgba(40, 167, 69, 0.1);
        }
        
        .round-result.lose {
            border-color: #dc3545;
            background: rgba(220, 53, 69, 0.1);
        }
        
        /* 投注区域 */
        .bet-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: var(--border-radius);
            border: 2px solid rgba(255, 112, 67, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .bet-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--gradient);
            opacity: 0.05;
            z-index: -1;
        }
        
        .bet-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        
        .bet-info {
            background: rgba(255, 112, 67, 0.1);
            border: 2px solid rgba(255, 112, 67, 0.3);
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        
        .bet-amount {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }
        
        .bet-description {
            color: #ddd;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        
        .multiplier-info {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 1rem;
            animation: keyGlow 2s ease-in-out infinite;
        }
        
        @keyframes keyGlow {
            0%, 100% {
                box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            }
            50% {
                box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            }
        }
        
        /* 宝箱区域 */
        .treasure-section {
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: var(--border-radius);
            padding: 2rem;
            margin-bottom: 3rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .treasure-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, #FFD700, #FFA500);
            opacity: 0.05;
            z-index: -1;
            animation: treasureGlow 3s ease-in-out infinite;
        }
        
        @keyframes treasureGlow {
            0%, 100% { opacity: 0.05; }
            50% { opacity: 0.1; }
        }
        
        .treasure-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            margin-bottom: 1.5rem;
        }
        
        .treasure-box-container {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1.5rem;
        }
        
        .treasure-box {
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            color: white;
            box-shadow: 0 20px 40px rgba(255, 215, 0, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            animation: treasureFloat 3s ease-in-out infinite;
        }
        
        @keyframes treasureFloat {
            0%, 100% { 
                transform: translateY(0px) scale(1); 
            }
            50% { 
                transform: translateY(-10px) scale(1.05); 
            }
        }
        
        .treasure-box::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background: linear-gradient(45deg, #FFD700, #FFA500, #FF69B4, #FF1493);
            border-radius: 20px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .treasure-box:hover::before {
            opacity: 0.8;
        }
        
        .treasure-box:hover {
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 25px 50px rgba(255, 215, 0, 0.5);
        }
        
        .treasure-box.opening {
            animation: boxOpen 2s ease-in-out forwards;
        }
        
        @keyframes boxOpen {
            0% { 
                transform: scale(1) rotate(0deg); 
            }
            25% { 
                transform: scale(1.1) rotate(5deg); 
            }
            50% { 
                transform: scale(1.2) rotate(-5deg); 
            }
            75% { 
                transform: scale(1.1) rotate(5deg); 
            }
            100% { 
                transform: scale(0) rotate(360deg); 
                opacity: 0; 
            }
        }
        
        .key-count {
            background: rgba(255, 215, 0, 0.2);
            border: 2px solid rgba(255, 215, 0, 0.5);
            border-radius: 15px;
            padding: 0.75rem 1.5rem;
            font-weight: bold;
            color: white;
            margin-bottom: 1.5rem;
        }
        
        .open-treasure-btn {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .open-treasure-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.4);
        }
        
        .open-treasure-btn:disabled {
            background: linear-gradient(135deg, #6c757d, #5a6268);
            cursor: not-allowed;
            transform: none;
        }
        
        /* 历史记录 */
        .history-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: var(--border-radius);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        .history-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        
        .history-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            margin-bottom: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: var(--transition);
        }
        
        .history-item:hover {
            transform: translateX(5px);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .history-item:last-child {
            margin-bottom: 0;
        }
        
        .history-dice {
            font-size: 1.5rem;
            font-weight: bold;
            color: #e67e22;
        }
        
        .history-details {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .history-amount {
            font-weight: bold;
            color: white;
        }
        
        .history-multiplier {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        
        .history-result {
            font-weight: bold;
        }
        
        .history-result.win {
            color: #28a745;
        }
        
        .history-result.lose {
            color: #dc3545;
        }
        
        .history-key {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: bold;
        }
        
        /* 统计数据 */
        .stats-section {
            background: rgba(255, 255, 255, 0.1);

                    // 生成骰子点数（按概率）
                    generateDiceValue() {
                        const random = Math.random();
                        let cumulativeProbability = 0;
                        
                        for (const dice of this.diceProbability) {
                            cumulativeProbability += dice.probability;
                            if (random <= cumulativeProbability) {
                                return dice.value;
                            }
                        }
                        
                        return 1; // 默认返回1
                    },
                    
                    // 生成骰子结果
                    generateDiceResults(rounds) {
                        const results = [];
                        
                        for (let i = 0; i < rounds; i++) {
                            const round = {
                                roundNumber: i + 1,
                                dice: [],
                                totalPoints: 0,
                                winAmount: 0,
                                isLoss: false
                            };
                            
                            // 生成3个骰子
                            for (let j = 0; j < 3; j++) {
                                const value = this.generateDiceValue();
                                round.dice.push(value);
                                round.totalPoints += value;
                            }
                            
                            // 计算获得积分
                            round.winAmount = Math.round(round.totalPoints * this.gameState.multiplier);
                            
                            // 判断是否亏损
                            round.isLoss = round.winAmount < this.gameState.currentBet;
                            
                            results.push(round);
                        }
                        
                        return results;
                    },
                    
                    // 获取骰子面
                    getDiceFace(value) {
                        const faces = ['', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
                        return faces[value];
                    },
                    
                    // 开始游戏
                    async playGame() {
                        try {
                            console.log('🌐 === 开始游戏 ===');
                            
                            if (this.gameState.isPlaying) {
                                console.log('🌐 游戏正在进行中，忽略操作');
                                return;
                            }
                            
                            // 检查积分系统
                            if (!window.pointsSystem) {
                                this.showMessage('积分系统未初始化', 'error');
                                return;
                            }
                            
                            const totalBet = this.gameState.currentBet * this.gameState.selectedRounds;
                            
                            // 检查积分是否足够
                            if (!window.pointsSystem.hasEnoughPoints(totalBet)) {
                                this.showMessage(`积分不足！需要 ${totalBet} 天创积分`, 'error');
                                return;
                            }
                            
                            console.log(`🌐 开始游戏，局数: ${this.gameState.selectedRounds}, 总投注: ${totalBet}`);
                            
                            this.gameState.isPlaying = true;
                            const playBtn = document.getElementById('playBtn');
                            playBtn.disabled = true;
                            playBtn.textContent = '游戏进行中...';
                            
                            // 使用Promise包装异步操作
                            this.performGame(totalBet)
                                .then(() => {
                                    // 重置状态
                                    this.gameState.isPlaying = false;
                                    playBtn.disabled = false;
                                    playBtn.textContent = '🎲 开始游戏';
                                })
                                .catch((error) => {
                                    console.error('🌐 游戏过程中发生错误:', error);
                                    this.showMessage('游戏失败，请重试', 'error');
                                    
                                    // 重置状态
                                    this.gameState.isPlaying = false;
                                    playBtn.disabled = false;
                                    playBtn.textContent = '🎲 开始游戏';
                                });
                        } catch (error) {
                            console.error('🌐 开始游戏失败:', error);
                            this.showMessage('游戏失败', 'error');
                        }
                    },
                    
                    // 执行游戏逻辑
                    async performGame(totalBet) {
                        try {
                            console.log('🌐 === 执行游戏逻辑 ===');
                            
                            // 扣除积分
                            const deductResult = await window.pointsSystem.updatePoints(
                                -totalBet, 
                                '幸运骰子投注', 
                                { 
                                    rounds: this.gameState.selectedRounds,
                                    betAmount: this.gameState.currentBet,
                                    totalBet: totalBet,
                                    source: 'dice_game'
                                }
                            );
                            
                            if (!deductResult.success) {
                                console.error('🌐 积分扣除失败:', deductResult.error);
                                this.showMessage(deductResult.error || '积分扣除失败', 'error');
                                return;
                            }
                            
                            console.log('🌐 积分扣除成功:', deductResult);
                            
                            // 生成游戏结果
                            const results = this.generateDiceResults(this.gameState.selectedRounds);
                            
                            // 显示骰子动画
                            await this.showDiceAnimation(results);
                            
                            // 计算总获得积分
                            const totalWin = results.reduce((sum, round) => sum + round.winAmount, 0);
                            
                            // 增加积分
                            if (totalWin > 0) {
                                const addResult = await window.pointsSystem.updatePoints(
                                    totalWin, 
                                    '幸运骰子获得', 
                                    { 
                                        rounds: this.gameState.selectedRounds,
                                        winAmount: totalWin,
                                        source: 'dice_game'
                                    }
                                );
                                
                                if (!addResult.success) {
                                    console.error('🌐 积分增加失败:', addResult.error);
                                    this.showMessage('积分增加失败', 'error');
                                } else {
                                    console.log('🌐 积分增加成功:', addResult);
                                }
                            }
                            
                            // 计算金钥匙掉落
                            const lossRounds = results.filter(round => round.isLoss);
                            let keysDropped = 0;
                            
                            for (const lossRound of lossRounds) {
                                if (Math.random() < 0.05) { // 5%概率
                                    keysDropped++;
                                }
                            }
                            
                            if (keysDropped > 0) {
                                this.gameState.goldKeys += keysDropped;
                                this.showMessage(`🔑 恭喜！获得 ${keysDropped} 把金钥匙！`, 'key');
                            }
                            
                            // 更新统计
                            this.gameState.stats.totalRounds += this.gameState.selectedRounds;
                            this.gameState.stats.totalBet += totalBet;
                            this.gameState.stats.totalWin += totalWin;
                            this.gameState.stats.netProfit = this.gameState.stats.totalWin - this.gameState.stats.totalBet;
                            
                            // 添加到历史记录
                            this.addToHistory(results, totalBet, totalWin, keysDropped);
                            
                            // 显示结算弹窗
                            this.showSettlementModal(results, totalBet, totalWin, keysDropped);
                            
                            // 保存到云端
                            this.saveGameData();
                            
                            // 更新UI
                            this.updateUI();
                            
                            console.log('🌐 游戏完成，剩余积分:', window.pointsSystem.getPoints());
                        } catch (error) {
                            console.error('🌐 执行游戏逻辑失败:', error);
                            throw error;
                        }
                    },
                    
                    // 显示骰子动画
                    async showDiceAnimation(results) {
                        const dice1 = document.getElementById('dice1');
                        const dice2 = document.getElementById('dice2');
                        const dice3 = document.getElementById('dice3');
                        
                        // 获取最后一局的结果
                        const lastResult = results[results.length - 1];
                        
                        // 添加3D旋转动画
                        dice1.style.animation = 'none';
                        dice2.style.animation = 'none';
                        dice3.style.animation = 'none';
                        
                        // 强制重绘
                        dice1.offsetHeight;
                        dice2.offsetHeight;
                        dice3.offsetHeight;
                        
                        // 设置动画
                        dice1.style.animation = 'rollDice 1.5s ease-in-out';
                        dice2.style.animation = 'rollDice 1.5s ease-in-out 0.2s';
                        dice3.style.animation = 'rollDice 1.5s ease-in-out 0.4s';
                        
                        // 等待动画完成
                        await new Promise(resolve => setTimeout(resolve, 1500));
                        
                        // 显示最终结果
                        dice1.textContent = this.getDiceFace(lastResult.dice[0]);
                        dice2.textContent = this.getDiceFace(lastResult.dice[1]);
                        dice3.textContent = this.getDiceFace(lastResult.dice[2]);
                        
                        // 移除动画
                        dice1.style.animation = '';
                        dice2.style.animation = '';
                        dice3.style.animation = '';
                        
                        // 更新结果显示
                        const roundResult = document.getElementById('roundResult');
                        roundResult.textContent = `点数: ${lastResult.totalPoints} | 获得: ${lastResult.winAmount} 积分`;
                        
                        if (lastResult.winAmount > 0) {
                            roundResult.className = 'round-result win';
                        } else {
                            roundResult.className = 'round-result lose';
                        }
                    },

                    showSettlementModal(results, totalBet, totalWin, keysDropped) {

                            // 创建结算页面
                            const settlementContent = document.createElement('div');

                            const netProfit = totalWin - totalBet;
                            
                            settlementContent.innerHTML = `

                                <div class="settlement-summary">

                                        <span class="summary-value ${netProfit >= 0 ? 'positive' : 'negative'}">
                                            ${netProfit}
                                        </span>
                                    </div>

                                <div class="rounds-results" id="roundsResults">
                                    ${results.map(round => {

                                        return `

                    // 添加到历史记录
                    addToHistory(results, totalBet, totalWin, keysDropped) {
                        try {
                            const historyItem = {
                                timestamp: new Date().toISOString(),
                                rounds: results.length,
                                dice: results.map(r => r.dice),
                                totalBet: totalBet,
                                totalWin: totalWin,
                                netProfit: totalWin - totalBet,
                                keysDropped: keysDropped,
                                result: totalWin > totalBet ? 'win' : 'lose'
                            };
                            
                            this.gameState.history.unshift(historyItem);
                            
                            // 只保留最近50条记录
                            if (this.gameState.history.length > 50) {
                                this.gameState.history = this.gameState.history.slice(0, 50);
                            }
                            
                            this.renderHistory();
                        } catch (error) {
                            console.error('🌐 添加到历史记录失败:', error);
                        }
                    },
                    
                    // 渲染历史记录
                    renderHistory() {
                        try {
                            const container = document.getElementById('historyList');
                            const history = this.gameState.history;
                            
                            if (!history || history.length === 0) {
                                container.innerHTML = '<div style="text-align: center; color: #666;">暂无记录</div>';
                                return;
                            }
                            
                            container.innerHTML = history.slice(0, 5).map(item => {
                                const date = new Date(item.timestamp);
                                const dateStr = `${date.getMonth() + 1}月${date.getDate()}日`;
                                
                                return `
                                    <div class="history-item">
                                        <div class="history-dice">${item.dice.join('')}</div>
                                        <div class="history-details">
                                            <span class="history-amount">${item.rounds}局</span>
                                            <span class="history-multiplier">0.6x</span>
                                            ${item.keysDropped > 0 ? `<span class="history-key">🔑${item.keysDropped}</span>` : ''}
                                            <span class="history-result ${item.result === 'win' ? 'win' : 'lose'}">${item.result === 'win' ? '盈利' : '亏损'}: ${Math.abs(item.netProfit)}</span>
                                        </div>
                                    </div>
                                `;
                            }).join('');
                        } catch (error) {
                            console.error('🌐 渲染历史记录失败:', error);
                        }
                    },
                    
                    // 打开宝箱
                    async openTreasureBox() {
                        try {
                            console.log('🌐 === 打开宝箱 ===');
                            
                            if (this.gameState.goldKeys <= 0) {
                                this.showMessage('金钥匙不足！', 'error');
                                return;
                            }
                            
                            const treasureBox = document.getElementById('treasureBox');
                            treasureBox.classList.add('opening');
                            
                            // 使用Promise包装异步操作
                            this.performOpenTreasureBox()
                                .then(() => {
                                    treasureBox.classList.remove('opening');
                                })
                                .catch((error) => {
                                    console.error('🌐 打开宝箱过程中发生错误:', error);
                                    this.showMessage('打开宝箱失败', 'error');
                                    treasureBox.classList.remove('opening');
                                });
                        } catch (error) {
                            console.error('🌐 打开宝箱失败:', error);
                            this.showMessage('打开宝箱失败', 'error');
                        }
                    },
                    
                    // 执行打开宝箱逻辑
                    async performOpenTreasureBox() {
                        try {
                            console.log('🌐 === 执行打开宝箱逻辑 ===');
                            
                            // 等待动画完成
                            await new Promise(resolve => setTimeout(resolve, 2000));
                            
                            // 根据概率选择奖励
                            const random = Math.random();
                            let cumulativeProbability = 0;
                            let selectedReward = null;
                            
                            for (const reward of this.treasureRewards) {
                                cumulativeProbability += reward.probability;
                                if (random <= cumulativeProbability) {
                                    selectedReward = reward;
                                    break;
                                }
                            }
                            
                            if (!selectedReward) {
                                selectedReward = this.treasureRewards[this.treasureRewards.length - 1];
                            }
                            
                            console.log('🌐 宝箱奖励:', selectedReward);
                            
                            // 处理奖励
                            if (selectedReward.type === 'points') {
                                // 积分奖励
                                const addResult = await window.pointsSystem.updatePoints(
                                    selectedReward.value, 
                                    '幸运骰子宝箱奖励', 
                                    { 
                                        rewardType: 'treasure_box',
                                        rewardAmount: selectedReward.value,
                                        rewardDescription: selectedReward.description
                                    }
                                );
                                
                                if (!addResult.success) {
                                    console.error('🌐 积分增加失败:', addResult.error);
                                    this.showMessage('积分增加失败', 'error');
                                } else {
                                    console.log('🌐 积分增加成功:', addResult);
                                    this.showMessage(`🎁 ${selectedReward.description}！`, 'treasure');
                                }
                            } else if (selectedReward.type === 'crutch') {
                                // 拐杖奖励 - 这里需要与背包系统集成
                                this.showMessage(`🎁 ${selectedReward.description}！`, 'treasure');
                                // TODO: 添加拐杖到背包
                                console.log('🌐 获得拐杖:', selectedReward.value, '个');
                            }
                            
                            // 消耗钥匙
                            this.gameState.goldKeys--;
                            
                            // 更新UI
                            this.updateUI();
                            this.saveGameData();
                            
                            console.log('🌐 打开宝箱完成');
                        } catch (error) {
                            console.error('🌐 执行打开宝箱失败:', error);
                            throw error;
                        }
                    },
                    
                    // 更新统计
                    updateStats() {
                        try {
                            document.getElementById('totalRounds').textContent = this.gameState.stats.totalRounds;
                            document.getElementById('totalBet').textContent = this.gameState.stats.totalBet;
                            document.getElementById('totalWin').textContent = this.gameState.stats.totalWin;
                            
                            const netProfitElement = document.getElementById('netProfit');
                            netProfitElement.textContent = this.gameState.stats.netProfit;
                            netProfitElement.className = this.gameState.stats.netProfit >= 0 ? 'stat-value positive' : 'stat-value negative';
                        } catch (error) {
                            console.error('🌐 更新统计失败:', error);
                        }
                    },
                    
                    // 显示消息
                    showMessage(text, type) {
                        try {
                            // 移除现有消息
                            const existingMessage = document.querySelector('.message');
                            if (existingMessage) {
                                existingMessage.remove();
                            }
                            
                            // 创建新消息
                            const message = document.createElement('div');
                            message.className = `message ${type}`;
                            message.textContent = text;
                            document.body.appendChild(message);
                            
                            // 显示动画
                            setTimeout(() => {
                                message.style.animation = 'messageSlideIn 0.3s ease';
                            }, 100);
                            
                            // 自动隐藏
                            setTimeout(() => {
                                message.style.animation = 'messageSlideOut 0.3s ease';
                                setTimeout(() => message.remove(), 300);
                            }, 3000);
                        } catch (error) {
                            console.error('🌐 显示消息失败:', error);
                        }
                    }
                };
                
                // 初始化游戏
                if (window.DiceGame) {
                    window.DiceGame.init();
                    
                    // 更新用户信息
                    window.DiceGame.updateUserInfo();
                } else {
                    console.error('🌐 DiceGame未定义');
                }
            }, 1000); // 延迟1秒确保所有系统加载完成
        });
    </script>
</body>
</html>
