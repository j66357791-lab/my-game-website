<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恐怖奶奶 - 天创时代</title>
    
    <!-- 强制云端模式配置 -->
    <meta name="force-cloud-mode" content="true">
    <meta name="api-server" content="https://tianchuang.onrender.com">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Quicksand', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d1b1b 50%, #0f0f0f 100%);
            min-height: 100vh;
            color: white;
            position: relative;
            overflow-x: hidden;
        }
        
        /* 恐怖背景效果 - 升级版 */
        .horror-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(139, 0, 0, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(75, 0, 130, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(255, 0, 0, 0.2) 0%, transparent 50%);
            animation: horrorPulse 4s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        
        /* 奶奶反射效果 */
        .grandma-reflection {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><path d="M100,20 C60,20 30,50 30,90 C30,130 60,160 100,160 C140,160 170,130 170,90 C170,50 140,20 100,20 Z" fill="none" stroke="rgba(139,0,0,0.1)" stroke-width="2"/></svg>') repeat;
            opacity: 0.1;
            pointer-events: none;
            z-index: 1;
            animation: reflectionMove 20s linear infinite;
        }
        
        @keyframes reflectionMove {
            0% { transform: translateX(0) translateY(0); }
            50% { transform: translateX(-10px) translateY(-5px); }
            100% { transform: translateX(0) translateY(0); }
        }
        
        /* 天气效果 - 血雨 */
        .weather-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            opacity: 0;
            transition: opacity 1s ease;
        }
        
        .weather-effect.blood-rain {
            background: 
                radial-gradient(circle at 10% 20%, rgba(139, 0, 0, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 30% 40%, rgba(139, 0, 0, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 50% 60%, rgba(139, 0, 0, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 70% 80%, rgba(139, 0, 0, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 10%, rgba(139, 0, 0, 0.1) 0%, transparent 20%);
            opacity: 0.3;
            animation: bloodRain 3s linear infinite;
        }
        
        @keyframes bloodRain {
            0% { background-position: 0 0; }
            100% { background-position: 0 100px; }
        }
        
        @keyframes horrorPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }
        
        /* 闪电效果 */
        .lightning {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0);
            pointer-events: none;
            z-index: 100;
        }
        
        .lightning.flash {
            animation: lightningFlash 0.3s ease-out;
        }
        
        @keyframes lightningFlash {
            0% { background: rgba(255, 255, 255, 0); }
            50% { background: rgba(255, 255, 255, 0.8); }
            100% { background: rgba(255, 255, 255, 0); }
        }
        
        /* 主容器 */
        .main-container {
            position: relative;
            z-index: 10;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* 顶部导航 */
        .top-nav {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 0, 0, 0.3);
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #8b0000, #4b0082);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            animation: logo-bounce 2s ease-in-out infinite;
        }
        
        @keyframes logo-bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }
        
        .logo-text {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(45deg, #ff0000, #8b0000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .nav-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .nav-btn {
            background: linear-gradient(135deg, #8b0000, #4b0082);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .nav-btn:hover::before {
            left: 100%;
        }
        
        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(139, 0, 0, 0.4);
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 0, 0, 0.3);
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #8b0000, #4b0082);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
        }
        
        .user-details {
            display: flex;
            flex-direction: column;
        }
        
        .user-name {
            font-weight: bold;
            color: #fff;
            font-size: 1rem;
        }
        
        .user-points {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            color: white;
            padding: 4px 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        
        /* 投入明细按钮 */
        .bet-details-btn {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .bet-details-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .bet-details-btn:hover::before {
            left: 100%;
        }
        
        .bet-details-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(40, 167, 69, 0.4);
        }
        
        /* 游戏统计栏 */
        .game-stats {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            border: 1px solid rgba(255, 0, 0, 0.3);
        }
        
        .stat-card {
            background: rgba(255, 0, 0, 0.1);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(255, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 0, 0, 0.2);
        }
        
        .stat-label {
            color: #ff6b6b;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }
        
        .stat-value {
            color: #fff;
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        /* 主游戏区域 */
        .game-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
            margin-bottom: 25px;
        }
        
        .game-area {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            border: 1px solid rgba(255, 0, 0, 0.3);
            position: relative;
        }
        
        .game-title {
            font-size: 2rem;
            color: #ff0000;
            margin-bottom: 25px;
            text-align: center;
            font-weight: bold;
            text-shadow: 0 3px 6px rgba(255, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            animation: titleGlow 2s ease-in-out infinite;
        }
        
        @keyframes titleGlow {
            0%, 100% { text-shadow: 0 3px 6px rgba(255, 0, 0, 0.5); }
            50% { text-shadow: 0 3px 15px rgba(255, 0, 0, 0.8); }
        }
        
        .grandma-icon {
            font-size: 1.5rem;
            animation: grandmaFloat 3s ease-in-out infinite;
        }
        
        @keyframes grandmaFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(-10px) rotate(-5deg); }
            75% { transform: translateY(-10px) rotate(5deg); }
        }
        
        /* 游戏计时器 */
        .game-timer {
            background: rgba(139, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: center;
            border: 1px solid rgba(255, 0, 0, 0.3);
            position: relative;
        }
        
        .timer-display {
            font-size: 3rem;
            font-weight: bold;
            color: #ff6b35;
            text-shadow: 0 3px 6px rgba(0,0,0,0.5);
            font-family: 'Courier New', monospace;
        }
        
        .timer-display.warning {
            color: #ff0000;
            animation: timerWarning 1s ease-in-out infinite;
        }
        
        @keyframes timerWarning {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .timer-status {
            color: #ff6b6b;
            font-size: 1rem;
            margin-top: 10px;
        }
        
        /* 房间网格 */
        .rooms-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .room {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        
        .room::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.5) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .room:hover::before {
            opacity: 1;
        }
        
        .room:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(255, 0, 0, 0.3);
            border-color: rgba(255, 0, 0, 0.6);
        }
        
        .room.selected {
            background: rgba(0, 100, 0, 0.3);
            border-color: #00ff00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }
        
        .room.danger {
            background: rgba(139, 0, 0, 0.5);
            border-color: #ff0000;
            animation: dangerPulse 1s ease-in-out infinite;
        }
        
        @keyframes dangerPulse {
            0%, 100% { 
                background: rgba(139, 0, 0, 0.5);
                transform: scale(1);
                box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
            }
            50% { 
                background: rgba(255, 0, 0, 0.7);
                transform: scale(1.05);
                box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
            }
        }
        
        .room.safe {
            background: rgba(0, 100, 0, 0.3);
            border-color: #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }
        
        .room-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
            transition: transform 0.3s ease;
        }
        
        .room:hover .room-icon {
            transform: scale(1.2);
        }
        
        .room-name {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 1.1em;
        }
        
        .room-pool {
            color: #ff6b35;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        
        .room-players {
            color: #3498db;
            font-size: 0.85em;
        }
        
        .room-bet {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(255, 107, 53, 0.8);
            color: white;
            padding: 2px 6px;
            border-radius: 5px;
            font-size: 0.7rem;
            font-weight: bold;
        }
        
        /* 投注区域 */
        .betting-area {
            background: rgba(139, 0, 0, 0.2);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 0, 0, 0.3);
        }
        
        .betting-title {
            color: #ff6b6b;
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .bet-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .bet-input {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 0, 0, 0.3);
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 1rem;
            width: 150px;
            text-align: center;
        }
        
        .bet-btn {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .bet-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 107, 53, 0.4);
        }
        
        .bet-btn:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .quick-bet-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: center;
        }
        
        .quick-bet {
            background: rgba(255, 107, 53, 0.2);
            border: 1px solid rgba(255, 107, 53, 0.5);
            color: #ff6b35;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .quick-bet:hover {
            background: rgba(255, 107, 53, 0.4);
            transform: translateY(-1px);
        }
        
        /* 侧边栏 */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        /* 历史记录 */
        .history-section {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            border: 1px solid rgba(255, 0, 0, 0.3);
        }
        
        .history-title {
            font-size: 1.3rem;
            color: #ff6b6b;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }
        
        .history-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .history-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin-bottom: 8px;
            background: rgba(255, 107, 53, 0.1);
            border-radius: 10px;
            border: 1px solid rgba(255, 107, 53, 0.2);
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        
        .history-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(255, 107, 53, 0.2);
        }
        
        .history-item:last-child {
            margin-bottom: 0;
        }
        
        .history-round {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            margin-right: 15px;
            font-size: 0.8rem;
        }
        
        .history-rooms {
            flex: 1;
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .history-mode {
            color: #ffd700;
            font-weight: bold;
            font-size: 0.8rem;
            margin-top: 3px;
        }
        
        /* 连胜显示 */
        .win-streak {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(255, 107, 53, 0.4);
            z-index: 100;
            animation: streakGlow 2s ease-in-out infinite;
        }
        
        @keyframes streakGlow {
            0%, 100% { box-shadow: 0 10px 25px rgba(255, 107, 53, 0.4); }
            50% { box-shadow: 0 15px 35px rgba(255, 107, 53, 0.6); }
        }
        
        .streak-text {
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        .streak-number {
            color: #ffd700;
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        /* 结算页面 */
        .settlement-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: modalFadeIn 0.3s ease-out;
        }
        
        @keyframes modalFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .settlement-page {
            background: linear-gradient(135deg, #1a1a1a, #2d1b1b);
            border-radius: 25px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 107, 53, 0.3);
            position: relative;
            animation: modalSlideUp 0.3s ease-out;
        }
        
        @keyframes modalSlideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .settlement-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(255, 107, 53, 0.3);
        }
        
        .settlement-title {
            font-size: 2rem;
            color: #ff6b6b;
            font-weight: bold;
        }
        
        .settlement-close {
            background: none;
            border: none;
            color: #ff6b6b;
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .settlement-close:hover {
            background: rgba(255, 107, 107, 0.1);
            transform: rotate(90deg);
        }
        
        .settlement-result {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: resultBounce 1s ease-in-out infinite;
        }
        
        .settlement-result.win {
            color: #00ff00;
        }
        
        .settlement-result.lose {
            color: #ff0000;
        }
        
        @keyframes resultBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .settlement-status {
            font-size: 1.5rem;
            color: #ff6b6b;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        .settlement-location {
            background: rgba(255, 107, 53, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .settlement-location-title {
            color: #ff6b6b;
            font-size: 1.2rem;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .settlement-location-name {
            font-size: 1.5rem;
            color: white;
            font-weight: bold;
        }
        
        .settlement-details {
            background: rgba(255, 107, 53, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .settlement-details-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: white;
            font-size: 1rem;
        }
        
        .settlement-details-label {
            color: #ff6b6b;
            font-weight: 600;
        }
        
        .settlement-details-value {
            font-weight: bold;

    <script>
        // 恐怖奶奶游戏系统 - 强制云端模式版
        const GrandmaGame = {
            // 游戏状态
            gameState: {
                currentRound: 1,
                timeLeft: 30,
                isLocked: false,
                selectedRoom: null,
                betAmount: 0,
                totalBets: 0,
                winStreak: 0,
                hasProtection: false,
                rooms: [],
                players: {},
                history: [],
                grandmaAppeared: false,
                userPoints: 0,
                roundEnded: false,
                // 投入明细统计
                betDetails: {
                    totalBetAmount: 0,
                    totalWinAmount: 0,
                    totalLoseAmount: 0,
                    totalRounds: 0,
                    winRounds: 0,
                    loseRounds: 0,
                    maxWinStreak: 0,
                    currentWinStreak: 0,
                    betHistory: []
                },
                // 陪玩系统 - 优化版
                botPlayers: [],
                userTotalBet: 0,
                botTotalBet: 0,
                botBetMultiplier: 1.5,
                botConfig: {
                    minBots: 1,
                    maxBots: 3,
                    minDelay: 500,
                    maxDelay: 2000,
                    targetRatio: 0.7, // 目标：机器人投注达到真人投注的70%
                    variance: 0.2 // 允许20%的方差
                }
            },
            
            // 房间配置
            roomConfig: [
                { id: 1, name: '卧室', icon: '🛏️' },
                { id: 2, name: '厨房', icon: '🍳' },
                { id: 3, name: '客厅', icon: '🛋️' },
                { id: 4, name: '浴室', icon: '🚿' },
                { id: 5, name: '书房', icon: '📚' },
                { id: 6, name: '储藏室', icon: '📦' },
                { id: 7, name: '阳台', icon: '🌺' },
                { id: 8, name: '地下室', icon: '🔦' }
            ],
            
            // 初始化游戏
            init() {
                console.log('🌐 === 恐怖奶奶游戏初始化（强制云端模式） ===');
                
                // 强制设置云端模式
                if (window.dataAdapter) {
                    window.dataAdapter.forceCloudMode();
                }
                
                if (window.apiService) {
                    window.apiService.forceCloudMode();
                }
                
                if (window.pointsSystem) {
                    window.pointsSystem.forceCloudMode = true;
                    window.pointsSystem.init();
                }
                
                if (window.userSystem) {
                    window.userSystem.init();
                }
                
                // 检查登录状态
                if (!this.checkLogin()) {
                    console.log('🌐 用户未登录，跳转到登录页面');
                    this.redirectToLogin();
                    return;
                }
                
                console.log('🌐 用户已登录，继续初始化');
                
                // 初始化用户数据
                this.loadUserData();
                
                // 初始化房间
                this.initRooms();
                
                // 初始化其他功能
                this.startGameTimer();
                this.simulatePlayers();
                this.startWeatherEffect();
                
                // 监听积分更新事件
                window.addEventListener('pointsUpdated', (e) => {
                    const { newPoints } = e.detail;
                    this.updateUserInfo();
                });
                
                // 监听用户信息更新事件
                window.addEventListener('userInfoUpdated', (e) => {
                    const { user } = e.detail;
                    this.updateUserInfo();
                });
                
                console.log('🌐 恐怖奶奶游戏初始化完成');
            },
            
            // 检查登录状态
            checkLogin() {
                try {
                    const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
                    const currentUser = localStorage.getItem('currentUser');
                    
                    if (!isLoggedIn || !currentUser) {
                        return false;
                    }
                    
                    // 验证用户数据完整性
                    const user = JSON.parse(currentUser);
                    if (!user || !user.isActive) {
                        return false;
                    }
                    
                    return true;
                } catch (error) {
                    console.error('🌐 检查登录状态失败:', error);
                    return false;
                }
            },
            
            // 跳转到登录页面
            redirectToLogin() {
                try {
                    console.log('🌐 正在跳转到登录页面...');
                    window.location.href = 'login.html';
                } catch (error) {
                    console.error('🌐 跳转失败:', error);
                    // 备用跳转方式
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 100);
                }
            },
            
            // 加载用户数据
            async loadUserData() {
                try {
                    console.log('🌐 === 加载用户数据 ===');
                    
                    const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
                    const userId = user.id || user.username;
                    
                    // 从积分系统获取积分
                    if (window.pointsSystem) {
                        try {
                            const points = window.pointsSystem.getPoints();
                            this.gameState.userPoints = points;
                            console.log('🌐 从积分系统获取积分:', points);
                        } catch (error) {
                            console.log('🌐 积分系统获取积分失败，使用本地数据:', error);
                            this.gameState.userPoints = user.points || 0;
                        }
                    } else {
                        this.gameState.userPoints = user.points || 0;
                    }
                    
                    // 从云端加载游戏数据
                    if (window.apiService) {
                        try {
                            const response = await window.apiService.request('GET', `/games/grandma/user/${userId}`);
                            if (response.success) {
                                this.gameState.betDetails = response.data.betDetails || this.gameState.betDetails;
                                this.gameState.winStreak = response.data.winStreak || 0;
                                console.log('🌐 从云端加载游戏数据成功:', response.data);
                            } else {
                                console.log('🌐 云端游戏数据为空，使用本地数据');
                                this.loadLocalGameData();
                            }
                        } catch (error) {
                            console.log('🌐 云端游戏数据加载失败，使用本地数据:', error);
                            this.loadLocalGameData();
                        }
                    } else {
                        console.log('🌐 API服务未初始化，使用本地数据');
                        this.loadLocalGameData();
                    }
                    
                    // 更新UI
                    this.updateUserInfo();
                } catch (error) {
                    console.error('🌐 加载用户数据失败:', error);
                }
            },
            
            // 加载本地游戏数据（备用）
            loadLocalGameData() {
                try {
                    const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
                    const userId = user.id || user.username;
                    
                    // 从localStorage加载游戏数据
                    const savedBetDetails = localStorage.getItem(`grandmaBetDetails_${userId}`);
                    if (savedBetDetails) {
                        this.gameState.betDetails = JSON.parse(savedBetDetails);
                    }
                    
                    // 加载其他游戏状态
                    const savedGameState = localStorage.getItem(`grandmaGameState_${userId}`);
                    if (savedGameState) {
                        const state = JSON.parse(savedGameState);
                        this.gameState.winStreak = state.winStreak || 0;
                    }
                } catch (error) {
                    console.error('🌐 加载本地游戏数据失败:', error);
                }
            },
            
            // 保存用户数据到云端
            async saveUserDataToCloud() {
                try {
                    console.log('🌐 === 保存用户数据到云端 ===');
                    
                    const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
                    const userId = user.id || user.username;
                    
                    if (!userId) {

            // 更新投入明细统计
            updateBetDetails(isWin, amount, roomName, round) {
                try {
                    const betDetails = this.gameState.betDetails;
                    
                    // 更新基础统计
                    betDetails.totalBetAmount += amount;
                    betDetails.totalRounds++;
                    
                    if (isWin) {
                        betDetails.totalWinAmount += amount;
                        betDetails.winRounds++;
                        betDetails.currentWinStreak++;
                        
                        // 更新最大连胜
                        if (betDetails.currentWinStreak > betDetails.maxWinStreak) {
                            betDetails.maxWinStreak = betDetails.currentWinStreak;
                        }
                    } else {
                        betDetails.totalLoseAmount += amount;
                        betDetails.loseRounds++;
                        betDetails.currentWinStreak = 0;
                    }
                    
                    // 添加到历史记录
                    const historyRecord = {
                        round: round,
                        roomName: roomName,
                        amount: amount,
                        isWin: isWin,
                        timestamp: new Date().toISOString()
                    };
                    
                    betDetails.betHistory.unshift(historyRecord);
                    
                    // 只保留最近50条记录
                    if (betDetails.betHistory.length > 50) {
                        betDetails.betHistory = betDetails.betHistory.slice(0, 50);
                    }
                    
                    // 保存到用户数据
                    this.saveUserData();
                    
                    console.log('🌐 投入明细统计已更新');
