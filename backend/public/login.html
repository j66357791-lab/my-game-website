<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 天创时代</title>
    
    <!-- 强制云端模式配置 -->
    <meta name="force-cloud-mode" content="true">
    <meta name="api-server" content="https://tianchuang.onrender.com">
    
    <!-- 优化字体加载 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        /* 这里保持您原有的所有CSS样式不变 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #FF7043;
            --secondary: #FFB74D;
            --accent: #FFC107;
            --bg-dark: #2C3E50;
            --bg-light: #34495E;
            --text-light: #ECF0F1;
            --gradient: linear-gradient(135deg, #FF7043, #FFB74D, #FFC107);
            --shadow: 0 8px 25px rgba(255, 112, 67, 0.3);
            --transition: all 0.3s ease;
            --border-radius: 20px;
        }
        
        body {
            font-family: 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
            background: linear-gradient(135deg, #2C3E50, #34495E);
            min-height: 100vh;
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* 登录容器 */
        .login-container {
            background: rgba(44, 62, 80, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: var(--shadow);
            border: 2px solid rgba(255, 112, 67, 0.3);
            width: 100%;
            max-width: 450px;
            position: relative;
            overflow: hidden;
        }
        
        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--gradient);
            opacity: 0.05;
            z-index: -1;
        }
        
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .logo-icon {
            width: 50px;
            height: 50px;
            background: var(--gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            box-shadow: var(--shadow);
        }
        
        .logo-text {
            font-size: 2.2rem;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 2rem;
            color: white;
            font-weight: 700;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-light);
            font-weight: 500;
        }
        
        .input-container {
            position: relative;
        }
        
        input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 112, 67, 0.3);
            border-radius: 10px;
            color: var(--text-light);
            font-size: 1rem;
            transition: var(--transition);
        }
        
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 112, 67, 0.2);
        }
        
        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
        }
        
        .btn {
            width: 100%;
            padding: 1rem;
            background: var(--gradient);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        
        .btn:disabled {
            background: rgba(255, 112, 67, 0.5);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .toggle-form {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 112, 67, 0.3);
        }
        
        .toggle-form a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .toggle-form a:hover {
            color: var(--accent);
        }
        
        .message {
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        
        .message.error {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, 0.3);
        }
        
        .message.success {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            border: 1px solid rgba(46, 204, 113, 0.3);
        }
        
        .message.info {
            background: rgba(52, 152, 219, 0.2);
            color: #3498db;
            border: 1px solid rgba(52, 152, 219, 0.3);
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 忘记密码按钮 */
        .forgot-password {
            text-align: center;
            margin-top: 1rem;
        }
        
        .forgot-password a {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: var(--transition);
        }
        
        .forgot-password a:hover {
            color: var(--accent);
        }
        
        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: rgba(44, 62, 80, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: var(--shadow);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        
        .modal-icon {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
        }
        
        .modal-title {
            font-size: 1.5rem;
            color: white;
            margin-bottom: 1rem;
            font-weight: 700;
        }
        
        .modal-message {
            color: var(--text-light);
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        
        .modal-btn {
            background: var(--gradient);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        
        /* 云端连接状态指示器 */
        .cloud-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            background: rgba(44, 62, 80, 0.9);
            border-radius: 10px;
            color: white;
            font-size: 0.9rem;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 112, 67, 0.3);
        }
        
        .cloud-status.connected {
            background: rgba(46, 204, 113, 0.9);
            border-color: rgba(46, 204, 113, 0.3);
        }
        
        .cloud-status.connecting {
            background: rgba(241, 196, 15, 0.9);
            border-color: rgba(241, 196, 15, 0.3);
        }
        
        .cloud-status.error {
            background: rgba(231, 76, 60, 0.9);
            border-color: rgba(231, 76, 60, 0.3);
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .login-container {
                padding: 2rem;
                margin: 1rem;
            }
            
            .logo-text {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <!-- 云端连接状态指示器 -->
    <div class="cloud-status connecting" id="cloudStatus">
        <i class="fas fa-cloud"></i>
        <span id="cloudStatusText">连接云端服务器...</span>
    </div>
    
    <!-- 登录容器 -->
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">🎮</div>
            <div class="logo-text">天创时代</div>
        </div>
        
        <h1>欢迎回来</h1>
        
        <div id="message"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">用户名/手机号</label>
                <div class="input-container">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="username" name="username" placeholder="请输入用户名或手机号" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">密码</label>
                <div class="input-container">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" name="password" placeholder="请输入密码" required>
                </div>
            </div>
            
            <button type="submit" class="btn" id="loginBtn">
                <span>登录</span>
            </button>
            
            <div class="forgot-password">
                <a href="#" id="forgotPasswordLink">忘记密码？</a>
            </div>
        </form>
        
        <form id="registerForm" style="display: none;">
            <div class="form-group">
                <label for="regUsername">用户名</label>
                <div class="input-container">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="regUsername" name="username" placeholder="请输入用户名" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="regPhone">手机号</label>
                <div class="input-container">
                    <i class="fas fa-phone input-icon"></i>
                    <input type="tel" id="regPhone" name="phone" placeholder="请输入手机号" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="regName">姓名</label>
                <div class="input-container">
                    <i class="fas fa-id-card input-icon"></i>
                    <input type="text" id="regName" name="name" placeholder="请输入真实姓名" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="regPassword">密码</label>
                <div class="input-container">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="regPassword" name="password" placeholder="请输入密码（至少6位）" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="regConfirmPassword">确认密码</label>
                <div class="input-container">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="regConfirmPassword" name="confirmPassword" placeholder="请再次输入密码" required>
                </div>
            </div>
            
            <button type="submit" class="btn" id="registerBtn">
                <span>注册</span>
            </button>
        </form>
        
        <div class="toggle-form">
            <a href="#" id="toggleLink">
                <i class="fas fa-user-plus"></i>
                <span>没有账号？点击注册</span>
            </a>
        </div>
    </div>
    
    <!-- 忘记密码模态框 -->
    <div class="modal" id="forgotPasswordModal">
        <div class="modal-content">
            <div class="modal-icon">🔒</div>
            <h2 class="modal-title">忘记密码</h2>
            <div class="modal-message">
                如有需要修改密码请联系管理员<br>
                管理员将协助您重置密码
            </div>
            <button class="modal-btn" onclick="closeForgotPasswordModal()">我知道了</button>
        </div>
    </div>

    <!-- 强制云端模式的脚本加载 -->
    <script>
        // 强制设置云端模式配置
        window.API_CONFIG = {
            BASE_URL: 'https://tianchuang.onrender.com/api',
            ENDPOINTS: {
                USER: {
                    LOGIN: '/login',
                    REGISTER: '/register',
                    GET_INFO: '/user',
                    UPDATE_INFO: '/user',
                    LOGOUT: '/logout',
                    GET_ALL: '/users',
                    UPDATE_POINTS: '/user/points',
                    GET_HISTORY: '/user/points/history',
                    GET_STATS: '/user/stats'
                },
                POINTS: {
                    GET_BALANCE: '/points/balance',
                    GET_HISTORY: '/points/history',
                    UPDATE_POINTS: '/points/update',
                    GET_DASHBOARD: '/points/dashboard',
                    GET_AUDIT_LOG: '/points/audit-log',
                    GET_STATISTICS: '/points/statistics'
                },
                BACKPACK: {
                    GET_ITEMS: '/backpack/items',
                    ADD_ITEM: '/backpack/items',
                    USE_ITEM: '/backpack/items/use',
                    DELETE_ITEM: '/backpack/items/:id',
                    GET_STATS: '/backpack/stats'
                },
                ORDERS: {
                    GET_LIST: '/orders',
                    CREATE: '/orders',
                    GET_DETAIL: '/orders/:id',
                    UPDATE_STATUS: '/orders/:id/status',
                    CANCEL: '/orders/:id/cancel',
                    GET_USER_ORDERS: '/orders/user'
                },
                GAMES: {
                    DICE_PLAY: '/games/dice/new',
                    DICE_LEADERBOARD: '/games/dice/leaderboard',
                    GRANDMA_PLAY: '/games/grandma/play',
                    DOLL_BUY: '/dolls/buy',
                    DOLL_LIST: '/dolls'
                },
                COMMON: {
                    HEALTH_CHECK: '/health',
                    VERSION: '/version'
                }
            },
            TIMEOUT: 15000,
            VERSION: '1.0.0',
            ENV: 'production'
        };

        // 强制设置云端模式
        localStorage.setItem('forceCloudMode', 'true');
        localStorage.removeItem('useLocalStorage');

        // 动态加载JS文件 - 确保云端版本
        function loadScript(src, callback) {
            const script = document.createElement('script');
            script.src = src;
            script.onload = callback;
            script.onerror = () => {
                console.error('Failed to load script:', src);
                updateCloudStatus('error', '脚本加载失败');
                if (callback) callback();
            };
            document.head.appendChild(script);
        }

        // 按顺序加载云端JS文件
        const scripts = [
            'js/api-config.js',
            'js/api-service.js',
            'js/data-adapter.js',
            'js/common.js',
            'js/points-system.js',
            'js/backpack-system.js',
            'js/user-system.js'
        ];

        let loadedScripts = 0;
        
        function loadNextScript() {
            if (loadedScripts < scripts.length) {
                updateCloudStatus('connecting', `加载脚本中... (${loadedScripts + 1}/${scripts.length})`);
                loadScript(scripts[loadedScripts], () => {
                    loadedScripts++;
                    loadNextScript();
                });
            } else {
                // 所有脚本加载完成，初始化登录系统
                initLoginSystem();
            }
        }

        // 更新云端连接状态
        function updateCloudStatus(status, text) {
            const cloudStatus = document.getElementById('cloudStatus');
            const cloudStatusText = document.getElementById('cloudStatusText');
            
            if (cloudStatus) {
                cloudStatus.className = `cloud-status ${status}`;
                cloudStatusText.textContent = text;
            }
        }

        // 初始化登录系统
        function initLoginSystem() {
            console.log('🌐 === 登录系统初始化（强制云端模式） ===');
            
            // 强制设置云端模式
            if (window.dataAdapter) {
                window.dataAdapter.forceCloudMode();
            }
            
            if (window.apiService) {
                window.apiService.forceCloudMode();
            }
            
            // 检查是否已登录
            if (checkLoginStatus()) {
                console.log('🌐 用户已登录，跳转到首页');
                updateCloudStatus('connected', '已连接云端');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
                return;
            }
            
            // 初始化管理员账号
            initAdminAccount();
            
            // 绑定事件
            bindEvents();
            
            // 测试云端连接
            testCloudConnection();
            
            console.log('✅ 登录系统初始化完成（云端模式）');
        }

        // 测试云端连接
        async function testCloudConnection() {
            try {
                updateCloudStatus('connecting', '测试云端连接...');
                
                if (window.apiService) {
                    const result = await window.apiService.healthCheck();
                    if (result.success) {
                        updateCloudStatus('connected', '云端连接正常');
                        console.log('✅ 云端连接测试成功');
                    } else {
                        updateCloudStatus('error', '云端连接异常');
                        console.error('❌ 云端连接测试失败', result);
                    }
                } else {
                    updateCloudStatus('error', 'API服务未加载');
                    console.error('❌ API服务未找到');
                }
            } catch (error) {
                updateCloudStatus('error', '云端连接失败');
                console.error('❌ 云端连接测试失败', error);
            }
        }

        // 检查登录状态
        function checkLoginStatus() {
            try {
                const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
                const currentUser = localStorage.getItem('currentUser');
                
                if (isLoggedIn && currentUser) {
                    const user = JSON.parse(currentUser);
                    if (user && user.isActive) {
                        return true;
                    }
                }
            } catch (error) {
                console.error('检查登录状态失败:', error);
            }
            return false;
        }

        // 初始化管理员账号
        async function initAdminAccount() {
            try {
                console.log('🌐 初始化管理员账号（云端模式）...');
                
                const adminAccount = {
                    id: 'admin',
                    username: 'admin',
                    password: 'admin123',
                    name: '系统管理员',
                    role: 'admin',
                    phone: '18679012034',
                    email: 'admin@tianchuang.com',
                    registerTime: new Date().toISOString(),
                    lastLoginTime: null,
                    isActive: true,
                    points: 999999
                };
                
                // 检查云端是否已存在管理员账号
                if (window.dataAdapter) {
                    try {
                        const result = await window.dataAdapter.getUserInfo();
                        if (result.success && result.data && result.data.user) {
                            console.log('✅ 云端管理员账号已存在');
                            return;
                        }
                    } catch (error) {
                        console.log('🌐 云端管理员账号不存在，将创建');
                    }
                }
                
                // 创建管理员账号
                if (window.dataAdapter) {
                    try {
                        const result = await window.dataAdapter.login({
                            username: adminAccount.username,
                            password: adminAccount.password
                        });
                        
                        if (result.success) {
                            console.log('✅ 云端管理员账号创建/验证成功');
                        } else {
                            console.log('🌐 尝试创建云端管理员账号...');
                            // 尝试注册管理员账号
                            const registerResult = await window.dataAdapter.register(adminAccount);
                            if (registerResult.success) {
                                console.log('✅ 云端管理员账号创建成功');
                            }
                        }
                    } catch (error) {
                        console.error('❌ 云端管理员账号初始化失败', error);
                    }
                }
                
                // 降级到本地管理员账号
                const allUsers = JSON.parse(localStorage.getItem('allUsers') || '[]');
                const adminExists = allUsers.find(u => u.username === adminAccount.username);
                
                if (!adminExists) {
                    allUsers.push(adminAccount);
                    localStorage.setItem('allUsers', JSON.stringify(allUsers));
                    console.log('🌐 本地管理员账号已创建');
                } else {
                    console.log('🌐 本地管理员账号已存在');
                }
            } catch (error) {
                console.error('初始化管理员账号失败:', error);
            }
        }

        // 绑定事件
        function bindEvents() {
            try {
                // 切换登录/注册表单
                const toggleLink = document.getElementById('toggleLink');
                if (toggleLink) {
                    toggleLink.addEventListener('click', function(e) {
                        e.preventDefault();
                        switchForm();
                    });
                }
                
                // 忘记密码链接
                const forgotPasswordLink = document.getElementById('forgotPasswordLink');
                if (forgotPasswordLink) {
                    forgotPasswordLink.addEventListener('click', function(e) {
                        e.preventDefault();
                        showForgotPasswordModal();
                    });
                }
                
                // 登录表单提交
                const loginForm = document.getElementById('loginForm');
                if (loginForm) {
                    loginForm.addEventListener('submit', function(e) {
                        e.preventDefault();
                        handleLogin();
                    });
                }
                
                // 注册表单提交
                const registerForm = document.getElementById('registerForm');
                if (registerForm) {
                    registerForm.addEventListener('submit', function(e) {
                        e.preventDefault();
                        handleRegister();
                    });
                }
            } catch (error) {
                console.error('绑定事件失败:', error);
            }
        }

        // 切换表单
        function switchForm() {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const toggleLink = document.getElementById('toggleLink');
            
            if (loginForm.style.display !== 'none') {
                // 切换到注册表单
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                toggleLink.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>已有账号？点击登录</span>';
            } else {
                // 切换到登录表单
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                toggleLink.innerHTML = '<i class="fas fa-user-plus"></i><span>没有账号？点击注册</span>';
            }
            
            // 隐藏消息
            hideMessage();
        }

        // 处理登录 - 强制云端版
        async function handleLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            
            // 基本验证
            if (!username || !password) {
                showMessage('请填写用户名和密码', 'error');
                return;
            }
            
            // 设置按钮加载状态
            setButtonLoading(loginBtn, true);
            
            try {
                console.log('🌐 开始云端登录验证', { username });
                
                // 优先使用云端API
                if (window.dataAdapter) {
                    try {
                        updateCloudStatus('connecting', '云端登录验证中...');
                        const result = await window.dataAdapter.login({ username, password });
                        
                        if (result.success || result.user) {
                            const user = result.user || result.data.user;
                            
                            // 保存登录信息
                            localStorage.setItem('currentUser', JSON.stringify(user));
                            localStorage.setItem('isLoggedIn', 'true');
                            
                            // 保存token
                            if (result.token) {
                                localStorage.setItem('authToken', result.token);
                                window.apiService.setAuthToken(result.token);
                            }
                            
                            showMessage('登录成功！正在跳转...', 'success');
                            updateCloudStatus('connected', '云端登录成功');
                            
                            // 延迟跳转，确保消息显示
                            setTimeout(() => {
                                window.location.href = 'index.html';
                            }, 1500);
                            
                            return;
                        } else {
                            showMessage('用户名或密码错误', 'error');
                        }
                    } catch (cloudError) {
                        console.error('❌ 云端登录失败', cloudError);
                        showMessage('云端登录失败，请检查网络', 'error');
                        updateCloudStatus('error', '云端登录失败');
                    }
                } else {
                    showMessage('云端服务不可用', 'error');
                    updateCloudStatus('error', '云端服务不可用');
                }
                
            } catch (error) {
                console.error('登录失败:', error);
                showMessage('登录失败，请重试', 'error');
                updateCloudStatus('error', '登录失败');
            }
            
            setButtonLoading(loginBtn, false);
        }

        // 处理注册 - 强制云端版
        async function handleRegister() {
            const username = document.getElementById('regUsername').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const name = document.getElementById('regName').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const registerBtn = document.getElementById('registerBtn');
            
            // 基本验证
            if (!username || !phone || !name || !password || !confirmPassword) {
                showMessage('请填写完整信息', 'error');
                return;
            }
            
            if (password.length < 6) {
                showMessage('密码长度至少6位', 'error');
                return;
            }
            
            if (password !== confirmPassword) {
                showMessage('两次输入的密码不一致', 'error');
                return;
            }
            
            // 验证手机号格式
            const phoneRegex = /^1[3-9]\d{9}$/;
            if (!phoneRegex.test(phone)) {
                showMessage('请输入正确的手机号格式', 'error');
                return;
            }
            
            // 验证用户名格式
            if (username.length < 3 || username.length > 20) {
                showMessage('用户名长度应在3-20个字符之间', 'error');
                return;
            }
            
            // 设置按钮加载状态
            setButtonLoading(registerBtn, true);
            
            try {
                console.log('🌐 开始云端注册', { username, phone, name });
                
                // 优先使用云端API
                if (window.dataAdapter) {
                    try {
                        updateCloudStatus('connecting', '云端注册中...');
                        const result = await window.dataAdapter.register({
                            username,
                            phone,
                            name,
                            password
                        });
                        
                        if (result.success || result.user) {
                            const user = result.user || result.data.user;
                            
                            showMessage('注册成功！请登录', 'success');
                            updateCloudStatus('connected', '云端注册成功');
                            
                            // 切换到登录表单并填充用户名
                            setTimeout(() => {
                                switchForm();
                                const usernameInput = document.getElementById('username');
                                if (usernameInput) usernameInput.value = username;
                            }, 1500);
                            
                            return;
                        } else {
                            if (result.message && result.message.includes('已存在')) {
                                showMessage('用户名或手机号已被注册', 'error');
                            } else {
                                showMessage('注册失败', 'error');
                            }
                        }
                    } catch (cloudError) {
                        console.error('❌ 云端注册失败', cloudError);
                        showMessage('云端注册失败，请检查网络', 'error');
                        updateCloudStatus('error', '云端注册失败');
                    }
                } else {
                    showMessage('云端服务不可用', 'error');
                    updateCloudStatus('error', '云端服务不可用');
                }
                
            } catch (error) {
                console.error('注册失败:', error);
                showMessage('注册失败，请重试', 'error');
                updateCloudStatus('error', '注册失败');
            }
            
            setButtonLoading(registerBtn, false);
        }

        // 显示忘记密码模态框
        function showForgotPasswordModal() {
            const modal = document.getElementById('forgotPasswordModal');
            if (modal) modal.classList.add('active');
        }

        // 关闭忘记密码模态框
        function closeForgotPasswordModal() {
            const modal = document.getElementById('forgotPasswordModal');
            if (modal) modal.classList.remove('active');
        }

        // 显示消息
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            if (messageDiv) {
                messageDiv.textContent = text;
                messageDiv.className = `message ${type}`;
                
                setTimeout(() => {
                    hideMessage();
                }, 5000);
            }
        }

        // 隐藏消息
        function hideMessage() {
            const messageDiv = document.getElementById('message');
            if (messageDiv) {
                messageDiv.textContent = '';
                messageDiv.className = '';
            }
        }

        // 设置按钮加载状态
        function setButtonLoading(button, isLoading) {
            if (button) {
                if (isLoading) {
                    button.disabled = true;
                    button.innerHTML = '<div class="loading"></div>';
                } else {
                    button.disabled = false;
                    button.innerHTML = '<span>' + (button.id === 'loginBtn' ? '登录' : '注册') + '</span>';
                }
            }
        }

        // 开始加载脚本
        console.log('🌐 开始加载云端JS文件...');
        loadNextScript();
    </script>
</body>
</html>
