<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动物大冒险</title>
    <link rel="stylesheet" href="css/animal-adventure.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>🎮 动物大冒险</h1>
            <div class="user-info">
                <span class="balance">积分: <span id="userBalance">0</span></span>
                <span class="candies">糖果: <span id="userCandies">0</span></span>
                <a href="/" class="back-btn">返回主页</a>
            </div>
        </header>

        <main class="game-main">
            <section class="game-status">
                <div class="round-info">
                    <span>第 <span id="roundId">1</span> 轮</span>
                    <span class="timer" id="timer">40</span>
                </div>
                <div class="game-message" id="gameMessage">选择一个房间进行躲避！</div>
            </section>

            <section class="rooms-section">
                <div class="rooms-grid">
                    <button class="room-btn" data-room="grassland">
                        <div class="room-icon">🌿</div>
                        <div class="room-name">草丛地</div>
                        <div class="room-status"></div>
                    </button>
                    <button class="room-btn" data-room="bushes">
                        <div class="room-icon">🌳</div>
                        <div class="room-name">灌木丛</div>
                        <div class="room-status"></div>
                    </button>
                    <button class="room-btn" data-room="forest">
                        <div class="room-icon">🌲</div>
                        <div class="room-name">森林</div>
                        <div class="room-status"></div>
                    </button>
                    <button class="room-btn" data-room="lake">
                        <div class="room-icon">💧</div>
                        <div class="room-name">湖泊</div>
                        <div class="room-status"></div>
                    </button>
                    <button class="room-btn" data-room="cave">
                        <div class="room-icon">🕳️</div>
                        <div class="room-name">洞穴</div>
                        <div class="room-status"></div>
                    </button>
                </div>
            </section>

            <section class="bet-section">
                <div class="bet-controls">
                    <input type="number" id="betAmount" placeholder="输入投注积分" min="1">
                    <button id="confirmBet" class="bet-btn">确认投注</button>
                </div>
                <div class="quick-bet">
                    <button class="quick-bet-btn" data-amount="10">10</button>
                    <button class="quick-bet-btn" data-amount="50">50</button>
                    <button class="quick-bet-btn" data-amount="100">100</button>
                    <button class="quick-bet-btn" data-amount="500">500</button>
                    <button class="quick-bet-btn" data-amount="all">全部</button>
                </div>
            </section>

            <section class="history-section">
                <h3>历史记录</h3>
                <div id="historyList" class="history-list"></div>
            </section>
        </main>
    </div>

    <div id="roundResultModal" class="modal">
        <div class="modal-content">
            <h2 id="resultTitle">轮次结束</h2>
            <div id="resultDetails"></div>
            <button id="closeModal" class="close-btn">确定</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // 检查用户是否已登录
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/';
        }

        class AnimalAdventureGame {
            constructor() {
                this.currentRound = null;
                this.selectedRoom = null;
                this.userBalance = 0;
                this.userCandies = 0;
                this.timer = null;
                this.socket = io();
                
                this.init();
            }

            init() {
                this.bindEvents();
                this.connectSocket();
                this.loadGameStatus();
                this.loadHistory();
            }

            bindEvents() {
                // 房间选择
                document.querySelectorAll('.room-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.selectRoom(e.currentTarget.dataset.room);
                    });
                });

                // 投注控制
                document.getElementById('confirmBet').addEventListener('click', () => {
                    this.placeBet();
                });

                // 快速投注
                document.querySelectorAll('.quick-bet-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const amount = e.currentTarget.dataset.amount;
                        if (amount === 'all') {
                            document.getElementById('betAmount').value = this.userBalance;
                        } else {
                            document.getElementById('betAmount').value = amount;
                        }
                    });
                });

                // 模态框关闭
                document.getElementById('closeModal').addEventListener('click', () => {
                    document.getElementById('roundResultModal').style.display = 'none';
                });
            }

            connectSocket() {
                this.socket.emit('join-adventure');
                
                this.socket.on('adventure-new-round', (data) => {
                    this.handleNewRound(data);
                });
                
                this.socket.on('adventure-round-end', (data) => {
                    this.handleRoundEnd(data);
                });
            }

            async loadGameStatus() {
                try {
                    const response = await fetch('/api/animal-adventure/status', {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    const data = await response.json();
                    
                    this.currentRound = data;
                    this.userBalance = data.userBalance;
                    this.userCandies = data.userCandies || 0;
                    
                    this.updateUI();
                    this.startTimer();
                } catch (error) {
                    console.error('加载游戏状态失败:', error);
                    this.showMessage('加载游戏状态失败，请刷新页面重试');
                }
            }

            async loadHistory() {
                try {
                    const response = await fetch('/api/animal-adventure/history', {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    const history = await response.json();
                    
                    this.displayHistory(history);
                } catch (error) {
                    console.error('加载历史记录失败:', error);
                }
            }

            selectRoom(room) {
                if (this.currentRound && this.currentRound.status === 'active') {
                    // 清除之前的选择
                    document.querySelectorAll('.room-btn').forEach(btn => {
                        btn.classList.remove('selected');
                    });
                    
                    // 标记新选择
                    document.querySelector(`[data-room="${room}"]`).classList.add('selected');
                    this.selectedRoom = room;
                } else {
                    this.showMessage('游戏未开始或已结束');
                }
            }

            async placeBet() {
                const betAmount = parseInt(document.getElementById('betAmount').value);
                
                if (!this.selectedRoom) {
                    this.showMessage('请先选择一个房间！');
                    return;
                }
                
                if (!betAmount || betAmount <= 0) {
                    this.showMessage('请输入有效的投注金额！');
                    return;
                }
                
                try {
                    const response = await fetch('/api/animal-adventure/bet', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            room: this.selectedRoom,
                            betAmount: betAmount
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        this.userBalance = data.balance;
                        this.updateUI();
                        this.showMessage('投注成功！');
                    } else {
                        this.showMessage(data.error || '投注失败！');
                    }
                } catch (error) {
                    console.error('投注失败:', error);
                    this.showMessage('网络错误，请重试！');
                }
            }

            startTimer() {
                if (this.timer) {
                    clearInterval(this.timer);
                }
                
                this.timer = setInterval(() => {
                    if (this.currentRound && this.currentRound.status === 'active') {
                        const timeLeft = Math.max(0, Math.ceil(this.currentRound.timeLeft / 1000));
                        document.getElementById('timer').textContent = timeLeft;
                        
                        if (timeLeft <= 3) {
                            document.getElementById('timer').style.background = '#ff4444';
                        } else {
                            document.getElementById('timer').style.background = '#ff6b6b';
                        }
                        
                        if (timeLeft === 0) {
                            clearInterval(this.timer);
                        }
                    }
                }, 1000);
            }

            handleNewRound(data) {
                this.currentRound = data;
                document.getElementById('roundId').textContent = data.roundId;
                
                // 清除房间状态
                document.querySelectorAll('.room-btn').forEach(btn => {
                    btn.classList.remove('danger', 'safe');
                });
                
                this.startTimer();
            }

            handleRoundEnd(data) {
                // 显示结果
                const modal = document.getElementById('roundResultModal');
                const title = document.getElementById('resultTitle');
                const details = document.getElementById('resultDetails');
                
                // 标记房间状态
                document.querySelectorAll('.room-btn').forEach(btn => {
                    btn.classList.remove('danger', 'safe');
                    if (data.hunterRooms.includes(btn.dataset.room)) {
                        btn.classList.add('danger');
                    } else {
                        btn.classList.add('safe');
                    }
                });
                
                // 检查玩家结果
                const playerResult = data.results.find(r => r.userId === this.getUserId());
                if (playerResult) {
                    if (playerResult.isSurvivor) {
                        title.textContent = '🎉 幸存成功！';
                        details.innerHTML = `
                            <p>你选择了安全的${this.getRoomName(playerResult.room)}</p>
                            <p>获得积分: ${playerResult.reward || 0}</p>
                            <p>获得糖果: ${playerResult.candies || 0}</p>
                        `;
                    } else {
                        title.textContent = '😢 被猎人抓住了！';
                        details.innerHTML = `
                            <p>你选择的${this.getRoomName(playerResult.room)}被猎人袭击了</p>
                            <p>获得糖果: ${playerResult.candies || 0}</p>
                        `;
                    }
                } else {
                    title.textContent = '轮次结束';
                    details.innerHTML = `
                        <p>猎人袭击了: ${data.hunterRooms.map(room => this.getRoomName(room)).join(', ')}</p>
                        ${data.isRageMode ? '<p style="color: red;">⚠️ 狂暴模式启动！</p>' : ''}
                    `;
                }
                
                modal.style.display = 'block';
                
                // 3秒后刷新状态
                setTimeout(() => {
                    this.loadGameStatus();
                    this.loadHistory();
                }, 3000);
            }

            getRoomName(room) {
                const names = {
                    grassland: '草丛地',
                    bushes: '灌木丛',
                    forest: '森林',
                    lake: '湖泊',
                    cave: '洞穴'
                };
                return names[room] || room;
            }

            displayHistory(history) {
                const historyList = document.getElementById('historyList');
                historyList.innerHTML = '';
                
                history.forEach(item => {
                    const div = document.createElement('div');
                    div.className = `history-item ${item.isSurvivor ? 'win' : 'lose'}`;
                    
                    div.innerHTML = `
                        <span>第${item.roundId}轮 - ${this.getRoomName(item.room)}</span>
                        <span>${item.isSurvivor ? '+' : '-'}${item.betAmount}积分</span>
                    `;
                    
                    historyList.appendChild(div);
                });
            }

            updateUI() {
                document.getElementById('roundId').textContent = this.currentRound.roundId;
                document.getElementById('userBalance').textContent = this.userBalance;
                document.getElementById('userCandies').textContent = this.userCandies;
            }

            showMessage(message) {
                const messageEl = document.getElementById('gameMessage');
                messageEl.textContent = message;
                messageEl.style.color = '#ff6b6b';
                
                setTimeout(() => {
                    messageEl.style.color = '#666';
                    messageEl.textContent = '选择一个房间进行躲避！';
                }, 3000);
            }

            getUserId() {
                // 从token中解析用户ID
                try {
                    const payload = JSON.parse(atob(token.split('.')[1]));
                    return payload.id;
                } catch (e) {
                    return null;
                }
            }
        }

        // 初始化游戏
        document.addEventListener('DOMContentLoaded', () => {
            new AnimalAdventureGame();
        });
    </script>
</body>
</html>
