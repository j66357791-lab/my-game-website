<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太空挑战 - 天创数字潮玩</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="css/space-challenge.css">
</head>
<body>
    <div class="container">
        <header class="game-header">
            <h1>🚀 太空挑战</h1>
            <div class="user-info">
                <span>积分: <span id="user-points">--</span></span>
            </div>
        </header>

        <div class="game-content">
            <main class="game-main">
                <!-- Boss区域 -->
                <section class="boss-section">
                    <h2>系统 Boss</h2>
                    <div class="boss-container" id="boss-container">
                        <div class="fighter-model boss-model" id="boss-model">?</div>
                        <div class="star-rating" id="boss-stars"></div>
                    </div>
                </section>

                <!-- 玩家战机区域 -->
                <section class="fighters-section">
                    <div class="fighter-slot" data-fighter-id="1">
                        <div class="fighter-model" id="fighter-1"></div>
                        <div class="star-rating" id="fighter-1-stars"></div>
                        <button class="bet-button">下注</button>
                        <div class="heat-bar"><div class="heat-bar-fill"></div></div>
                        <div class="time-progress">
                            <div class="time-progress-bar" id="progress-1"></div>
                        </div>
                    </div>
                    <div class="fighter-slot" data-fighter-id="2">
                        <div class="fighter-model" id="fighter-2"></div>
                        <div class="star-rating" id="fighter-2-stars"></div>
                        <button class="bet-button">下注</button>
                        <div class="heat-bar"><div class="heat-bar-fill"></div></div>
                        <div class="time-progress">
                            <div class="time-progress-bar" id="progress-2"></div>
                        </div>
                    </div>
                    <div class="fighter-slot" data-fighter-id="3">
                        <div class="fighter-model" id="fighter-3"></div>
                        <div class="star-rating" id="fighter-3-stars"></div>
                        <button class="bet-button">下注</button>
                        <div class="heat-bar"><div class="heat-bar-fill"></div></div>
                        <div class="time-progress">
                            <div class="time-progress-bar" id="progress-3"></div>
                        </div>
                    </div>
                    <div class="fighter-slot" data-fighter-id="4">
                        <div class="fighter-model" id="fighter-4"></div>
                        <div class="star-rating" id="fighter-4-stars"></div>
                        <button class="bet-button">下注</button>
                        <div class="heat-bar"><div class="heat-bar-fill"></div></div>
                        <div class="time-progress">
                            <div class="time-progress-bar" id="progress-4"></div>
                        </div>
                    </div>
                </section>

                <!-- 实时信息流 -->
                <section class="info-feed">
                    <h4>实时动态</h4>
                    <div class="feed-container" id="live-bets-feed">
                        <!-- 动态内容将在这里显示 -->
                    </div>
                </section>
            </main>

            <!-- 下注控制面板 -->
            <aside class="bet-control-panel">
                <h3>下注面板</h3>
                <div class="quick-bet-buttons">
                    <button data-amount="10">10</button>
                    <button data-amount="50">50</button>
                    <button data-amount="100">100</button>
                </div>
                <input type="number" id="bet-amount" placeholder="自定义金额">
                <button id="confirm-bet">确认下注</button>
                <p>本局剩余额度: <span id="remaining-quota">--</span></p>
            </aside>
        </div>

        <!-- 倒计时 -->
        <div class="timer-display" id="timer">30</div>
    </div>

    <script src="js/space-challenge.js"></script>
</body>
</html>
