<!-- family乐园/animal-game.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动物大冒险</title>
    <link rel="stylesheet" href="css/animal-game.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <div class="timer" id="timer">40</div>
            <div class="balance">积分: <span id="balance">0</span></div>
        </div>
        
        <div class="rooms-grid">
            <button class="room-btn" data-room="草丛地">
                <span class="room-icon">🌿</span>
                <span class="room-name">草丛地</span>
            </button>
            <button class="room-btn" data-room="灌木丛">
                <span class="room-icon">🌳</span>
                <span class="room-name">灌木丛</span>
            </button>
            <button class="room-btn" data-room="森林">
                <span class="room-icon">🌲</span>
                <span class="room-name">森林</span>
            </button>
            <button class="room-btn" data-room="湖泊">
                <span class="room-icon">💧</span>
                <span class="room-name">湖泊</span>
            </button>
            <button class="room-btn" data-room="洞穴">
                <span class="room-icon">🕳️</span>
                <span class="room-name">洞穴</span>
            </button>
        </div>
        
        <div class="bet-section">
            <input type="number" id="betAmount" placeholder="投注积分" min="1">
            <button id="confirmBet">确认投注</button>
        </div>
        
        <div class="history" id="history"></div>
    </div>
    
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script src="js/animal-game.js"></script>
</body>
</html>
