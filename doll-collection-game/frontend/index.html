<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动物大冒险</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        
        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        
        .username {
            font-size: 1.3em;
            font-weight: bold;
        }
        
        .points {
            font-size: 1.5em;
            font-weight: bold;
            color: #ffeb3b;
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        
        .round, .timer, .status {
            font-size: 1.2em;
            font-weight: bold;
        }
        
        .timer {
            font-size: 2em;
            color: #ffeb3b;
        }
        
        .rooms {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .room {
            background: white;
            border: 3px solid #ddd;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .room:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .room.attacked {
            border-color: #f44336;
            background: #ffebee;
            animation: shake 0.5s;
        }
        
        .room-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }
        
        .room-name {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .bet-controls {
            margin-top: 15px;
        }
        
        .bet-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            font-size: 1.1em;
            margin-bottom: 10px;
        }
        
        .bet-btn {
            width: 100%;
            padding: 12px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        
        .bet-btn:hover:not(:disabled) {
            background: #45a049;
        }
        
        .bet-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .controls {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .control-btn {
            background: #ff9800;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin: 0 10px;
            transition: background 0.3s ease;
        }
        
        .control-btn:hover {
            background: #e68900;
        }
        
        .message {
            background: #e3f2fd;
            border: 2px solid #2196f3;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }
        
        .results-panel {
            background: #fff3e0;
            border: 2px solid #ff9800;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .rage-mode {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
            animation: pulse 1s infinite;
        }
        
        .login-panel {
            background: #f5f5f5;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-input {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1.1em;
            margin: 10px;
        }
        
        .login-btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        
        .login-btn:hover {
            background: #45a049;
        }
        
        .test-accounts {
            background: #fff3e0;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .test-btn {
            background: #ff9800;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            margin: 5px;
            cursor: pointer;
            font-size: 0.9em;
        }
        
        .test-btn:hover {
            background: #e68900;
        }
        
        .betting-stats {
            background: #e8f5e8;
            border: 2px solid #4caf50;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 动物大冒险</h1>
        
        <!-- 登录面板 -->
        <div id="loginPanel" class="login-panel">
            <h2>🔐 用户登录</h2>
            <p>请输入您的用户名和密码</p>
            <input type="text" id="username" class="login-input" placeholder="用户名">
            <input type="password" id="password" class="login-input" placeholder="密码">
            <br>
            <button class="login-btn" onclick="login()">登录</button>
            <p style="margin-top: 15px; color: #666;">
                没有账户？<a href="#" onclick="showQuickRegister()" style="color: #2196f3;">快速注册</a>
            </p>
            
            <!-- 快速注册 -->
            <div id="quickRegister" style="display: none; margin-top: 20px; background: #e8f5e8; padding: 20px; border-radius: 10px;">
                <h3>⚡ 快速注册</h3>
                <input type="text" id="regUsername" class="login-input" placeholder="用户名">
                <input type="password" id="regPassword" class="login-input" placeholder="密码">
                <input type="email" id="regEmail" class="login-input" placeholder="邮箱">
                <br>
                <button class="login-btn" onclick="quickRegister()" style="background: #2196f3;">注册</button>
            </div>
            
            <!-- 测试账户 -->
            <div class="test-accounts">
                <h3>🧪 测试账户（点击直接登录）</h3>
                <button class="test-btn" onclick="useTestAccount('test1', '123456')">test1 (1000积分)</button>
                <button class="test-btn" onclick="useTestAccount('test2', '123456')">test2 (500积分)</button>
                <button class="test-btn" onclick="useTestAccount('test3', '123456')">test3 (2000积分)</button>
            </div>
        </div>
        
        <!-- 游戏界面 -->
        <div id="gamePanel" style="display: none;">
            <div class="user-info">
                <div class="username">👤 <span id="username">-</span></div>
                <div class="points">💰 积分: <span id="points">0</span></div>
            </div>
            
            <div class="game-info">
                <div class="round">第 <span id="round">1</span> 轮</div>
                <div class="timer"><span id="timer">40</span> 秒</div>
                <div class="status" id="status">准备中</div>
            </div>
            
            <div id="rageMode" class="rage-mode" style="display: none;">
                🔥 狂暴模式！多个房间同时被袭击！
            </div>
            
            <div class="betting-stats" id="bettingStats" style="display: none;">
                <div>🎯 本轮投注统计</div>
                <div>投注人数: <span id="totalBets">0</span> 人</div>
                <div>总投注额: <span id="totalAmount">0</span> 积分</div>
            </div>
            
            <div class="controls">
                <button class="control-btn" onclick="refreshPoints()">刷新积分</button>
                <button class="control-btn" onclick="startGame()">手动开始</button>
            </div>
            
            <div id="message" class="message" style="display: none;"></div>
            
            <div class="rooms">
                <div class="room" data-room="草丛地">
                    <div class="room-icon">🌿</div>
                    <div class="room-name">草丛地</div>
                    <div class="bet-controls">
                        <input type="number" class="bet-input" id="bet-草丛地" value="10" min="1">
                        <button class="bet-btn" onclick="placeBet('草丛地')">下注</button>
                    </div>
                </div>
                
                <div class="room" data-room="灌木丛">
                    <div class="room-icon">🌳</div>
                    <div class="room-name">灌木丛</div>
                    <div class="bet-controls">
                        <input type="number" class="bet-input" id="bet-灌木丛" value="10" min="1">
                        <button class="bet-btn" onclick="placeBet('灌木丛')">下注</button>
                    </div>
                </div>
                
                <div class="room" data-room="森林">
                    <div class="room-icon">🌲</div>
                    <div class="room-name">森林</div>
                    <div class="bet-controls">
                        <input type="number" class="bet-input" id="bet-森林" value="10" min="1">
                        <button class="bet-btn" onclick="placeBet('森林')">下注</button>
                    </div>
                </div>
                
                <div class="room" data-room="湖泊">
                    <div class="room-icon">💧</div>
                    <div class="room-name">湖泊</div>
                    <div class="bet-controls">
                        <input type="number" class="bet-input" id="bet-湖泊" value="10" min="1">
                        <button class="bet-btn" onclick="placeBet('湖泊')">下注</button>
                    </div>
                </div>
                
                <div class="room" data-room="洞穴">
                    <div class="room-icon">🕳️</div>
                    <div class="room-name">洞穴</div>
                    <div class="bet-controls">
                        <input type="number" class="bet-input" id="bet-洞穴" value="10" min="1">
                        <button class="bet-btn" onclick="placeBet('洞穴')">下注</button>
                    </div>
                </div>
            </div>
            
            <div id="resultsPanel" class="results-panel" style="display: none;">
                <h3>🏆 本轮结果</h3>
                <div id="resultsContent"></div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let socket = null
        let userToken = null
        let userData = null
        let gameState = null

        // 登录函数
        async function login() {
            const username = document.getElementById('username').value
            const password = document.getElementById('password').value
            
            if (!username || !password) {
                showMessage('请输入用户名和密码', 'error')
                return
            }
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                })
                
                const data = await response.json()
                
                if (response.ok) {
                    userToken = data.token
                    userData = data.user
                    
                    // 保存token到localStorage
                    localStorage.setItem('adventure_token', userToken)
                    
                    // 连接Socket
                    connectSocket()
                    
                    // 显示游戏界面
                    document.getElementById('loginPanel').style.display = 'none'
                    document.getElementById('gamePanel').style.display = 'block'
                    
                    showMessage('登录成功！', 'success')
                } else {
                    showMessage(data.message || '登录失败', 'error')
                }
            } catch (error) {
                showMessage('登录失败：' + error.message, 'error')
            }
        }

        // 快速注册
        async function quickRegister() {
            const username = document.getElementById('regUsername').value
            const password = document.getElementById('regPassword').value
            const email = document.getElementById('regEmail').value
            
            if (!username || !password || !email) {
                showMessage('请填写完整的注册信息', 'error')
                return
            }
            
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password, email })
                })
                
                const data = await response.json()
                
                if (response.ok) {
                    showMessage('注册成功！请登录', 'success')
                    // 自动填充登录表单
                    document.getElementById('username').value = username
                    document.getElementById('password').value = password
                    // 隐藏注册面板
                    document.getElementById('quickRegister').style.display = 'none'
                } else {
                    showMessage(data.message || '注册失败', 'error')
                }
            } catch (error) {
                showMessage('注册失败：' + error.message, 'error')
            }
        }

        // 显示快速注册
        function showQuickRegister() {
            const regPanel = document.getElementById('quickRegister')
            regPanel.style.display = regPanel.style.display === 'none' ? 'block' : 'none'
        }

        // 使用测试账户
        async function useTestAccount(username, password) {
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                })
                
                const data = await response.json()
                
                if (response.ok) {
                    userToken = data.token
                    userData = data.user
                    
                    localStorage.setItem('adventure_token', userToken)
                    
                    connectSocket()
                    
                    document.getElementById('loginPanel').style.display = 'none'
                    document.getElementById('gamePanel').style.display = 'block'
                    
                    showMessage(`使用测试账户 ${username} 登录成功！`, 'success')
                } else {
                    showMessage('测试账户登录失败，请先注册', 'error')
                }
            } catch (error) {
                showMessage('登录失败：' + error.message, 'error')
            }
        }

        // 连接Socket
        function connectSocket() {
            socket = io('/adventure-socket')
            
            socket.on('connect', () => {
                console.log('✅ Socket连接成功')
                
                // 发送登录信息
                socket.emit('login', { token: userToken })
            })
            
            socket.on('login-success', (data) => {
                console.log('✅ 游戏登录成功:', data)
                userData = data.user
                updateUserUI()
                
                if (data.gameState) {
                    updateGameUI(data.gameState)
                }
            })
            
            socket.on('auth-error', (data) => {
                showMessage('身份验证失败: ' + data.message, 'error')
                logout()
            })
            
            socket.on('game-update', (data) => {
                console.log('📊 游戏更新:', data)
                gameState = data
                updateGameUI(data)
            })
            
            socket.on('bet-success', (data) => {
                console.log('💰 投注成功:', data)
                userData.points = data.newPoints
                updateUserUI()
                showMessage(`投注成功！${data.roomId} ${data.amount}积分`, 'success')
            })
            
            socket.on('bet-error', (data) => {
                console.error('💰 投注失败:', data)
                showMessage('投注失败: ' + data.message, 'error')
            })
            
            socket.on('points-updated', (data) => {
                userData.points = data.points
                updateUserUI()
            })
            
            socket.on('results-announced', (data) => {
                console.log('🏆 结果公布:', data)
                showResults(data)
            })
            
            socket.on('betting-stats', (data) => {
                updateBettingStats(data)
            })
            
            socket.on('betting-locked', () => {
                showMessage('⏰ 投注时间结束！', 'warning')
                enableBetting(false)
            })
            
            socket.on('disconnect', () => {
                console.log('❌ Socket连接断开')
                showMessage('连接断开，请刷新页面', 'error')
            })
        }

        // 更新用户界面
        function updateUserUI() {
            document.getElementById('username').textContent = userData.username
            document.getElementById('points').textContent = userData.points
        }

        // 更新游戏界面
        function updateGameUI(data) {
            document.getElementById('round').textContent = data.round
            document.getElementById('timer').textContent = data.timeLeft
            
            const statusEl = document.getElementById('status')
            switch(data.status) {
                case 'betting':
                    statusEl.textContent = '投注中'
                    enableBetting(true)
                    break
                case 'hunting':
                    statusEl.textContent = '狩猎中'
                    enableBetting(false)
                    showAttackedRooms(data)
                    break
                default:
                    statusEl.textContent = '准备中'
                    enableBetting(false)
            }
            
            // 显示狂暴模式
            const rageModeEl = document.getElementById('rageMode')
            if (data.isRageMode) {
                rageModeEl.style.display = 'block'
            } else {
                rageModeEl.style.display = 'none'
            }
        }

        // 更新投注统计
        function updateBettingStats(data) {
            const statsEl = document.getElementById('bettingStats')
            document.getElementById('totalBets').textContent = data.totalBets
            document.getElementById('totalAmount').textContent = data.totalAmount
            statsEl.style.display = 'block'
        }

        // 显示被袭击的房间
        function showAttackedRooms(data) {
            document.querySelectorAll('.room').forEach(room => {
                room.classList.remove('attacked')
            })
            
            if (data.isRageMode && data.attackedRooms) {
                data.attackedRooms.forEach(roomName => {
                    const roomEl = document.querySelector(`[data-room="${roomName}"]`)
                    if (roomEl) {
                        roomEl.classList.add('attacked')
                    }
                })
                showMessage(`🔥 狂暴模式！袭击房间: ${data.attackedRooms.join(', ')}`, 'warning')
            } else if (data.hunterRoom) {
                const roomEl = document.querySelector(`[data-room="${data.hunterRoom}"]`)
                if (roomEl) {
                    roomEl.classList.add('attacked')
                }
                showMessage(`🎯 猎人袭击了${data.hunterRoom}！`, 'warning')
            }
        }

        // 显示结果
        function showResults(data) {
            const resultsPanel = document.getElementById('resultsPanel')
            const resultsContent = document.getElementById('resultsContent')
            
            let content = ''
            
            if (data.isRageMode) {
                content += `<p><strong>🔥 狂暴模式</strong></p>`
                content += `<p>袭击房间: ${data.attackedRooms.join(', ')}</p>`
            } else {
                content += `<p><strong>🎯 普通模式</strong></p>`
                content += `<p>猎人房间: ${data.hunterRoom}</p>`
            }
            
            content += `<p>胜者: ${data.winners.length}人</p>`
            content += `<p>败者: ${data.losers.length}人</p>`
            content += `<p>总奖池: ${data.rewardPool.toFixed(2)}积分</p>`
            
            // 查找当前用户的结果
            const myResult = data.winners.find(w => w.userId === userData.id) || 
                             data.losers.find(l => l.userId === userData.id)
            
            if (myResult) {
                if (data.winners.find(w => w.userId === userData.id)) {
                    content += `<p style="color: #4caf50; font-weight: bold;">🎉 恭喜获胜！赢得${myResult.profit}积分</p>`
                } else {
                    content += `<p style="color: #ff9800;">很遗憾，获得${myResult.candies}个糖果补偿</p>`
                }
            }
            
            resultsContent.innerHTML = content
            resultsPanel.style.display = 'block'
            
            // 10秒后隐藏结果
            setTimeout(() => {
                resultsPanel.style.display = 'none'
            }, 10000)
        }

        // 投注函数
        function placeBet(roomId) {
            if (!gameState || gameState.status !== 'betting') {
                showMessage('当前不在投注时间', 'error')
                return
            }
            
            if (gameState.timeLeft <= 3) {
                showMessage('投注时间已结束', 'error')
                return
            }
            
            const amount = parseInt(document.getElementById(`bet-${roomId}`).value)
            
            if (!amount || amount <= 0) {
                showMessage('请输入有效的投注金额', 'error')
                return
            }
            
            if (amount > userData.points) {
                showMessage('积分不足', 'error')
                return
            }
            
            console.log('💰 发送投注:', { roomId, amount })
            socket.emit('bet', { roomId, amount })
        }

        // 刷新积分
        function refreshPoints() {
            if (socket) {
                socket.emit('get-points')
            }
        }

        // 手动开始游戏
        function startGame() {
            if (socket) {
                socket.emit('start-game')
            }
        }

        // 启用/禁用投注
        function enableBetting(enable) {
            document.querySelectorAll('.bet-btn').forEach(btn => {
                btn.disabled = !enable
            })
        }

        // 显示消息
        function showMessage(text, type = 'info') {
            const messageEl = document.getElementById('message')
            messageEl.textContent = text
            messageEl.style.display = 'block'
            
            // 根据类型设置颜色
            switch(type) {
                case 'success':
                    messageEl.style.background = '#e8f5e8'
                    messageEl.style.borderColor = '#4caf50'
                    break
                case 'error':
                    messageEl.style.background = '#ffebee'
                    messageEl.style.borderColor = '#f44336'
                    break
                case 'warning':
                    messageEl.style.background = '#fff3e0'
                    messageEl.style.borderColor = '#ff9800'
                    break
                default:
                    messageEl.style.background = '#e3f2fd'
                    messageEl.style.borderColor = '#2196f3'
            }
            
            // 3秒后自动隐藏
            setTimeout(() => {
                messageEl.style.display = 'none'
            }, 3000)
        }

        // 登出函数
        function logout() {
            localStorage.removeItem('adventure_token')
            location.reload()
        }

        // 页面加载完成后检查token
        document.addEventListener('DOMContentLoaded', () => {
            const savedToken = localStorage.getItem('adventure_token')
            
            if (savedToken) {
                userToken = savedToken
                connectSocket()
                document.getElementById('loginPanel').style.display = 'none'
                document.getElementById('gamePanel').style.display = 'block'
            }
        })
    </script>
</body>
</html>
