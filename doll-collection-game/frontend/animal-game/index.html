<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动物大冒险 - 生存游戏</title>
    <link rel="stylesheet" href="css/animal-game.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
</head>
<body>
    <div class="game-wrapper">
        <!-- 游戏头部 -->
        <header class="game-header">
            <div class="header-left">
                <h1 class="game-title">🎮 动物大冒险</h1>
                <div class="round-info">
                    <span class="round-number">第 <span id="roundNumber">1</span> 轮</span>
                    <span class="game-mode" id="gameMode">普通模式</span>
                </div>
            </div>
            <div class="header-right">
                <div class="balance-display">
                    <span class="balance-label">💰 积分余额</span>
                    <span class="balance-amount" id="userBalance">0</span>
                </div>
                <div class="candy-display">
                    <span class="candy-label">🍬 糖果</span>
                    <span class="candy-amount" id="userCandies">0</span>
                </div>
            </div>
        </header>

        <!-- 游戏主体 -->
        <main class="game-main">
            <!-- 倒计时区域 -->
            <section class="timer-section">
                <div class="timer-container">
                    <div class="timer-circle">
                        <svg class="timer-svg" viewBox="0 0 200 200">
                            <circle class="timer-bg" cx="100" cy="100" r="90"></circle>
                            <circle class="timer-progress" id="timerProgress" cx="100" cy="100" r="90"></circle>
                        </svg>
                        <div class="timer-text">
                            <span class="timer-value" id="timerValue">40</span>
                            <span class="timer-label">秒</span>
                        </div>
                    </div>
                    <div class="timer-status" id="timerStatus">游戏进行中</div>
                </div>
            </section>

            <!-- 房间选择区域 -->
            <section class="rooms-section">
                <h2 class="section-title">选择你的藏身之处</h2>
                <div class="rooms-grid" id="roomsGrid">
                    <button class="room-card" data-room="草丛地">
                        <div class="room-icon">🌿</div>
                        <div class="room-name">草丛地</div>
                        <div class="room-stats">
                            <span class="player-count">0 人</span>
                            <span class="total-bet">0 积分</span>
                        </div>
                    </button>
                    <button class="room-card" data-room="灌木丛">
                        <div class="room-icon">🌳</div>
                        <div class="room-name">灌木丛</div>
                        <div class="room-stats">
                            <span class="player-count">0 人</span>
                            <span class="total-bet">0 积分</span>
                        </div>
                    </button>
                    <button class="room-card" data-room="森林">
                        <div class="room-icon">🌲</div>
                        <div class="room-name">森林</div>
                        <div class="room-stats">
                            <span class="player-count">0 人</span>
                            <span class="total-bet">0 积分</span>
                        </div>
                    </button>
                    <button class="room-card" data-room="湖泊">
                        <div class="room-icon">💧</div>
                        <div class="room-name">湖泊</div>
                        <div class="room-stats">
                            <span class="player-count">0 人</span>
                            <span class="total-bet">0 积分</span>
                        </div>
                    </button>
                    <button class="room-card" data-room="洞穴">
                        <div class="room-icon">🕳️</div>
                        <div class="room-name">洞穴</div>
                        <div class="room-stats">
                            <span class="player-count">0 人</span>
                            <span class="total-bet">0 积分</span>
                        </div>
                    </button>
                </div>
            </section>

            <!-- 投注区域 -->
            <section class="bet-section">
                <div class="bet-container">
                    <div class="bet-input-group">
                        <label for="betAmount">投注积分</label>
                        <div class="bet-input-wrapper">
                            <input type="number" id="betAmount" min="1" placeholder="输入投注金额">
                            <div class="quick-bet-buttons">
                                <button class="quick-bet" data-amount="10">10</button>
                                <button class="quick-bet" data-amount="50">50</button>
                                <button class="quick-bet" data-amount="100">100</button>
                                <button class="quick-bet" data-amount="500">500</button>
                                <button class="quick-bet" data-amount="1000">1K</button>
                                <button class="quick-bet" data-amount="all">ALL</button>
                            </div>
                        </div>
                    </div>
                    <div class="bet-actions">
                        <button class="bet-btn" id="confirmBet" disabled>
                            <span class="btn-text">确认投注</span>
                            <span class="btn-loader"></span>
                        </button>
                        <button class="cancel-btn" id="cancelBet" style="display: none;">取消投注</button>
                    </div>
                </div>
            </section>

            <!-- 游戏结果展示 -->
            <section class="result-section" id="resultSection" style="display: none;">
                <div class="result-container">
                    <h2 class="result-title" id="resultTitle">游戏结束</h2>
                    <div class="result-content">
                        <div class="hunter-info">
                            <span class="hunter-icon">🏹</span>
                            <span class="hunter-text">猎人袭击了</span>
                            <span class="target-rooms" id="targetRooms"></span>
                        </div>
                        <div class="player-result" id="playerResult"></div>
                        <div class="prize-info" id="prizeInfo"></div>
                    </div>
                </div>
            </section>
        </main>

        <!-- 侧边栏 -->
        <aside class="game-sidebar">
            <!-- 统计信息 -->
            <section class="stats-section">
                <h3 class="sidebar-title">📊 我的统计</h3>
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-label">总局数</span>
                        <span class="stat-value" id="totalGames">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">胜利</span>
                        <span class="stat-value" id="wins">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">失败</span>
                        <span class="stat-value" id="losses">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">胜率</span>
                        <span class="stat-value" id="winRate">0%</span>
                    </div>
                </div>
            </section>

            <!-- 历史记录 -->
            <section class="history-section">
                <h3 class="sidebar-title">📜 最近记录</h3>
                <div class="history-list" id="historyList">
                    <div class="history-empty">暂无记录</div>
                </div>
            </section>

            <!-- 游戏说明 -->
            <section class="help-section">
                <h3 class="sidebar-title">❓ 游戏规则</h3>
                <div class="help-content">
                    <p>🎯 选择一个房间藏身，躲避猎人的追捕</p>
                    <p>⏱️ 每轮40秒，倒计时结束前可更换房间</p>
                    <p>🏹 猎人会随机袭击1个房间（5%概率狂暴模式袭击多个）</p>
                    <p>💎 幸存者瓜分失败者的积分（扣除5%手续费）</p>
                    <p>🍬 失败者按比例获得糖果奖励</p>
                </div>
            </section>
        </aside>
    </div>

    <!-- 消息提示 -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Scripts -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/animal-game.js"></script>
</body>
</html>
