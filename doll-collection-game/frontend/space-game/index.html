<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太空挑战 - Space Challenge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
            position: relative;
        }

        /* 星空背景 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        /* 主容器 */
        .main-container {
            display: flex;
            gap: 20px;
            width: 95%;
            max-width: 1400px;
            height: 90vh;
        }

        /* 游戏容器 */
        .game-container {
            flex: 1;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 游戏标题 */
        .game-header {
            text-align: center;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-title {
            font-size: 2.5em;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            animation: glow 2s ease-in-out infinite alternate;
            flex: 1;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.5)); }
            to { filter: drop-shadow(0 0 30px rgba(255, 0, 255, 0.5)); }
        }

        /* 退出按钮 */
        .exit-button {
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
        }

        .exit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.5);
        }

        /* 倒计时 */
        .countdown {
            text-align: center;
            font-size: 1.3em;
            margin-bottom: 15px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .countdown-timer {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
            transition: all 0.3s;
        }

        .countdown-timer.urgent {
            animation: pulse 1s infinite;
            background: linear-gradient(45deg, #ff0000, #ff6b6b);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* 用户信息 */
        .user-info {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 0.9em;
        }

        .user-points {
            color: #ffd700;
            font-weight: bold;
        }

        .current-bets {
            color: #aaa;
        }

        /* 战舰区域 */
        .battlefield {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            gap: 20px;
            flex: 1;
        }

        .spaceship {
            flex: 1;
            text-align: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            transition: all 0.3s;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .spaceship.red {
            border: 2px solid rgba(255, 0, 0, 0.5);
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
        }

        .spaceship.blue {
            border: 2px solid rgba(0, 100, 255, 0.5);
            box-shadow: 0 0 30px rgba(0, 100, 255, 0.3);
        }

        .spaceship.winner {
            animation: victory 0.5s ease-in-out;
        }

        @keyframes victory {
            0%, 100% { transform: translateY(0) scale(1); }
            25% { transform: translateY(-10px) scale(1.05); }
            75% { transform: translateY(5px) scale(0.95); }
        }

        .spaceship-icon {
            font-size: 3em;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .spaceship.red .spaceship-icon {
            color: #ff4444;
            text-shadow: 0 0 20px rgba(255, 68, 68, 0.8);
        }

        .spaceship.blue .spaceship-icon {
            color: #4444ff;
            text-shadow: 0 0 20px rgba(68, 68, 255, 0.8);
        }

        .stars-display {
            margin: 10px 0;
            min-height: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 3px;
        }

        .star-icon {
            font-size: 1.3em;
            color: gold;
            opacity: 0;
            animation: starAppear 0.5s forwards;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }

        @keyframes starAppear {
            from {
                opacity: 0;
                transform: scale(0) rotate(180deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        /* 投注区域 */
        .betting-area {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 15px;
            overflow-y: auto;
            max-height: 300px;
        }

        .betting-options {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .bet-button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .bet-button:before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .bet-button:hover:before {
            width: 300px;
            height: 300px;
        }

        .bet-button.red {
            background: linear-gradient(45deg, #ff4444, #cc0000);
            color: white;
        }

        .bet-button.blue {
            background: linear-gradient(45deg, #4444ff, #0000cc);
            color: white;
        }

        .bet-button.draw {
            background: linear-gradient(45deg, #44ff44, #00cc00);
            color: white;
        }

        .bet-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .bet-button:active {
            transform: translateY(0);
        }

        .bet-button.selected {
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            animation: selected 0.5s;
        }

        @keyframes selected {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* 星级投注分区 */
        .star-betting-sections {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .star-betting-section {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 10px;
        }

        .star-betting-section.red {
            border: 1px solid rgba(255, 0, 0, 0.3);
        }

        .star-betting-section.blue {
            border: 1px solid rgba(0, 100, 255, 0.3);
        }

        .star-betting-title {
            text-align: center;
            margin-bottom: 10px;
            font-size: 1em;
            font-weight: bold;
        }

        .star-betting-section.red .star-betting-title {
            color: #ff6666;
        }

        .star-betting-section.blue .star-betting-title {
            color: #6666ff;
        }

        .star-bet-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }

        .star-bet-button {
            padding: 8px 5px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 5px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            font-size: 0.8em;
        }

        .star-bet-button:hover {
            background: rgba(255, 215, 0, 0.2);
            border-color: rgba(255, 215, 0, 0.6);
            transform: scale(1.05);
        }

        .star-bet-button.selected {
            background: rgba(255, 215, 0, 0.3);
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        /* 投注金额输入 */
        .bet-amount-input {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0;
            justify-content: center;
            flex-wrap: wrap;
        }

        .bet-amount-input input {
            padding: 6px 12px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 0.9em;
            width: 120px;
        }

        .bet-amount-input input:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 5px rgba(255, 215, 0, 0.3);
        }

        .quick-bet-buttons {
            display: flex;
            gap: 3px;
        }

        .quick-bet {
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.8em;
        }

        .quick-bet:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* 侧边栏 */
        .sidebar {
            width: 60px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 趋势按钮 */
        .trend-button {
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            border-radius: 15px;
            color: white;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .trend-button:hover {
            transform: translateY(-3px) scale(1.1);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }

        /* 音效控制按钮 */
        .sound-control {
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #f093fb, #f5576c);
            border: none;
            border-radius: 15px;
            color: white;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(240, 147, 251, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sound-control:hover {
            transform: translateY(-3px) scale(1.1);
            box-shadow: 0 8px 25px rgba(240, 147, 251, 0.5);
        }

        /* 趋势弹窗 */
        .trend-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .trend-modal.show {
            display: flex;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .trend-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: slideIn 0.5s;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .trend-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .trend-title {
            font-size: 1.8em;
            color: white;
        }

        .close-trend {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .close-trend:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* 3D图表容器 */
        .chart-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            height: 400px;
            position: relative;
            perspective: 1000px;
        }

        .chart-3d {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotate3d 20s infinite linear;
        }

        @keyframes rotate3d {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }

        .chart-3d:hover {
            animation-play-state: paused;
        }

        /* 统计信息 */
        .statistics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #ffd700;
        }

        .stat-label {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 5px;
        }

        /* 结果弹窗 */
        .result-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .result-modal.show {
            display: flex;
            animation: fadeIn 0.3s;
        }

        .result-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: slideIn 0.5s;
        }

        .result-title {
            font-size: 2em;
            margin-bottom: 20px;
            color: white;
        }

        .result-details {
            font-size: 1.2em;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.9);
        }

        .result-profit {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .result-profit.win {
            color: #4caf50;
        }

        .result-profit.lose {
            color: #f44336;
        }

        .close-result {
            padding: 12px 30px;
            background: white;
            color: #764ba2;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .close-result:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.3);
        }

        /* 响应式设计 */
        @media (max-width: 1024px) {
            .main-container {
                flex-direction: column;
                height: auto;
            }
            
            .sidebar {
                width: 100%;
                flex-direction: row;
                justify-content: center;
                margin: 10px 0;
            }
            
            .game-container {
                height: auto;
                max-height: 90vh;
            }
        }

        @media (max-width: 768px) {
            .game-title {
                font-size: 1.8em;
            }
            
            .battlefield {
                flex-direction: column;
                gap: 15px;
            }
            
            .star-betting-sections {
                flex-direction: column;
            }
            
            .betting-options {
                flex-direction: column;
            }
            
            .star-bet-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 480px) {
            .main-container {
                width: 100%;
                padding: 10px;
            }
            
            .game-container {
                padding: 15px;
            }
            
            .game-title {
                font-size: 1.5em;
            }
            
            .betting-options {
                gap: 5px;
            }
            
            .bet-button {
                padding: 10px 15px;
                font-size: 0.9em;
            }
            
            .star-bet-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <!-- 星空背景 -->
    <div class="stars" id="stars"></div>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 游戏容器 -->
        <div class="game-container">
            <!-- 游戏标题 -->
            <div class="game-header">
                <h1 class="game-title">🚀 太空挑战 🚀</h1>
                <button class="exit-button" id="exitButton">退出游戏</button>
            </div>

            <!-- 倒计时 -->
            <div class="countdown">
                <div class="countdown-timer" id="countdownTimer">准备开始...</div>
            </div>

            <!-- 用户信息 -->
            <div class="user-info">
                <div class="user-points">💰 积分: <span id="userPoints">10000</span></div>
                <div class="current-bets">本轮投注: <span id="currentBets">0</span></div>
                <div class="user-id">用户ID: <span id="userId">GUEST</span></div>
            </div>

            <!-- 战舰区域 -->
            <div class="battlefield">
                <div class="spaceship red" id="redSpaceship">
                    <div class="spaceship-icon">🚀</div>
                    <h3>红方战舰</h3>
                    <div class="stars-display" id="redStars"></div>
                    <div class="bet-amount-input">
                        <input type="number" id="redBetAmount" placeholder="投注金额" min="10" step="10">
                        <div class="quick-bet-buttons">
                            <button class="quick-bet" data-amount="100">100</button>
                            <button class="quick-bet" data-amount="500">500</button>
                            <button class="quick-bet" data-amount="1000">1K</button>
                        </div>
                    </div>
                </div>

                <div class="spaceship blue" id="blueSpaceship">
                    <div class="spaceship-icon">🛸</div>
                    <h3>蓝方战舰</h3>
                    <div class="stars-display" id="blueStars"></div>
                    <div class="bet-amount-input">
                        <input type="number" id="blueBetAmount" placeholder="投注金额" min="10" step="10">
                        <div class="quick-bet-buttons">
                            <button class="quick-bet" data-amount="100">100</button>
                            <button class="quick-bet" data-amount="500">500</button>
                            <button class="quick-bet" data-amount="1000">1K</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 投注区域 -->
            <div class="betting-area">
                <div class="betting-options">
                    <button class="bet-button red" id="redBet">
                        🔴 红方获胜<br>
                        <small>赔率: 0.95</small>
                    </button>
                    <button class="bet-button blue" id="blueBet">
                        🔵 蓝方获胜<br>
                        <small>赔率: 0.95</small>
                    </button>
                    <button class="bet-button draw" id="drawBet">
                        🤝 平局<br>
                        <small>赔率: 9.5</small>
                    </button>
                </div>

                <!-- 星级投注分区 -->
                <div class="star-betting-sections">
                    <div class="star-betting-section red">
                        <div class="star-betting-title">🔴 红方星级投注</div>
                        <div class="star-bet-grid" id="redStarBetGrid">
                            <!-- 动态生成1-10星投注按钮 -->
                        </div>
                    </div>
                    <div class="star-betting-section blue">
                        <div class="star-betting-title">🔵 蓝方星级投注</div>
                        <div class="star-bet-grid" id="blueStarBetGrid">
                            <!-- 动态生成1-10星投注按钮 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 侧边栏 -->
        <div class="sidebar">
            <button class="trend-button" id="trendButton" title="查看趋势">
                📊
            </button>
            <button class="sound-control" id="soundControl" title="音效控制">
                🔊
            </button>
        </div>
    </div>

    <!-- 趋势弹窗 -->
    <div class="trend-modal" id="trendModal">
        <div class="trend-content">
            <div class="trend-header">
                <h2 class="trend-title">📈 游戏趋势分析</h2>
                <button class="close-trend" id="closeTrend">关闭</button>
            </div>
            <div class="chart-container">
                <canvas id="trendChart" width="700" height="350"></canvas>
            </div>
            <div class="statistics" id="statistics">
                <!-- 动态生成统计信息 -->
            </div>
        </div>
    </div>

    <!-- 结果弹窗 -->
    <div class="result-modal" id="resultModal">
        <div class="result-content">
            <h2 class="result-title" id="resultTitle">游戏结果</h2>
            <div class="result-details" id="resultDetails"></div>
            <div class="result-profit" id="resultProfit"></div>
            <button class="close-result" id="closeResult">确定</button>
        </div>
    </div>

    <script>
        // 游戏核心类
        class SpaceChallengeGame {
            constructor() {
                this.gameState = 'waiting'; // waiting, betting, showing, result
                this.countdown = 30;
                this.userPoints = 10000;
                this.userId = 'GUEST'; // 预留用户ID接口
                this.currentBets = {
                    red: 0,
                    blue: 0,
                    draw: 0,
                    redStars: new Array(10).fill(0),
                    blueStars: new Array(10).fill(0)
                };
                this.selectedBets = new Set();
                this.redStar = 0;
                this.blueStar = 0;
                this.soundEnabled = true;
                this.countdownInterval = null;
                this.gameHistory = this.loadGameHistory();
                
                // API接口预留
                this.apiConfig = {
                    baseUrl: 'https://tianchuang.onrender.com', // 用户的网站地址
                    endpoints: {
                        getUser: '/api/user/info',
                        updatePoints: '/api/user/points',
                        saveGame: '/api/game/save',
                        getHistory: '/api/game/history'
                    }
                };
                
                this.init();
            }

            init() {
                this.createStarBackground();
                this.createStarBetButtons();
                this.bindEvents();
                this.initAudio();
                this.startNewRound();
            }

            // 创建星空背景
            createStarBackground() {
                const starsContainer = document.getElementById('stars');
                for (let i = 0; i < 150; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    star.style.animationDelay = Math.random() * 3 + 's';
                    star.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    starsContainer.appendChild(star);
                }
            }

            // 创建星级投注按钮
            createStarBetButtons() {
                const redGrid = document.getElementById('redStarBetGrid');
                const blueGrid = document.getElementById('blueStarBetGrid');
                
                for (let i = 1; i <= 10; i++) {
                    // 红方星级按钮
                    const redButton = document.createElement('button');
                    redButton.className = 'star-bet-button';
                    redButton.dataset.star = i;
                    redButton.dataset.color = 'red';
                    redButton.innerHTML = `${i}⭐<br><small>9.5x</small>`;
                    redGrid.appendChild(redButton);
                    
                    // 蓝方星级按钮
                    const blueButton = document.createElement('button');
                    blueButton.className = 'star-bet-button';
                    blueButton.dataset.star = i;
                    blueButton.dataset.color = 'blue';
                    blueButton.innerHTML = `${i}⭐<br><small>9.5x</small>`;
                    blueGrid.appendChild(blueButton);
                }
            }

            // 初始化音效 - 只保留交互音效
            initAudio() {
                try {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    
                    this.sounds = {
                        click: () => this.playTone(800, 0.1),
                        countdown: () => this.playTone(400, 0.2),
                        countdownUrgent: () => this.playTone(300, 0.3),
                        bet: () => this.playTone(600, 0.1),
                        star: () => this.playTone(1200, 0.08),
                        win: () => this.playMelody([523, 659, 784, 1047], 0.15),
                        lose: () => this.playMelody([784, 659, 523, 392], 0.15)
                    };
                    
                    console.log('音效系统初始化成功');
                } catch (error) {
                    console.error('音效初始化失败:', error);
                    this.sounds = {
                        click: () => {},
                        countdown: () => {},
                        countdownUrgent: () => {},
                        bet: () => {},
                        star: () => {},
                        win: () => {},
                        lose: () => {}
                    };
                }
            }

            // 播放音调
            playTone(frequency, duration) {
                if (!this.soundEnabled || !this.audioContext) return;
                
                try {
                    const oscillator = this.audioContext.createOscillator();
                    const gainNode = this.audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(this.audioContext.destination);
                    
                    oscillator.frequency.value = frequency;
                    oscillator.type = 'sine';
                    
                    gainNode.gain.setValueAtTime(0.3, this.audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + duration);
                    
                    oscillator.start(this.audioContext.currentTime);
                    oscillator.stop(this.audioContext.currentTime + duration);
                } catch (error) {
                    console.error('播放音调失败:', error);
                }
            }

            // 播放旋律
            playMelody(frequencies, duration) {
                if (!this.soundEnabled || !this.audioContext) return;
                
                try {
                    frequencies.forEach((freq, index) => {
                        setTimeout(() => this.playTone(freq, duration), index * duration * 1000);
                    });
                } catch (error) {
                    console.error('播放旋律失败:', error);
                }
            }

            // 绑定事件
            bindEvents() {
                // 退出按钮
                document.getElementById('exitButton').addEventListener('click', () => {
                    if (confirm('确定要退出游戏吗？')) {
                        alert('已退出游戏，返回上级页面');
                    }
                });

                // 投注按钮
                document.getElementById('redBet').addEventListener('click', () => {
                    this.sounds.click();
                    this.placeBet('red');
                });
                
                document.getElementById('blueBet').addEventListener('click', () => {
                    this.sounds.click();
                    this.placeBet('blue');
                });
                
                document.getElementById('drawBet').addEventListener('click', () => {
                    this.sounds.click();
                    this.placeBet('draw');
                });

                // 星级投注
                document.querySelectorAll('.star-bet-button').forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.sounds.click();
                        const star = parseInt(btn.dataset.star);
                        const color = btn.dataset.color;
                        this.placeStarBet(star, color);
                    });
                });

                // 快速投注按钮
                document.querySelectorAll('.quick-bet').forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.sounds.click();
                        const amount = parseInt(btn.dataset.amount);
                        const input = btn.closest('.bet-amount-input').querySelector('input');
                        input.value = amount;
                    });
                });

                // 趋势按钮
                document.getElementById('trendButton').addEventListener('click', () => {
                    this.sounds.click();
                    this.showTrendModal();
                });

                // 音效控制按钮
                document.getElementById('soundControl').addEventListener('click', () => {
                    this.sounds.click();
                    this.soundEnabled = !this.soundEnabled;
                    
                    // 更新按钮图标
                    const btn = document.getElementById('soundControl');
                    btn.innerHTML = this.soundEnabled ? '🔊' : '🔇';
                    btn.title = this.soundEnabled ? '音效开启' : '音效关闭';
                    
                    // 显示提示
                    this.showMessage(this.soundEnabled ? '音效已开启' : '音效已关闭');
                });

                // 关闭趋势弹窗
                document.getElementById('closeTrend').addEventListener('click', () => {
                    document.getElementById('trendModal').classList.remove('show');
                });

                // 关闭结果弹窗
                document.getElementById('closeResult').addEventListener('click', () => {
                    document.getElementById('resultModal').classList.remove('show');
                    this.startNewRound();
                });
            }

            // 开始新回合
            startNewRound() {
                this.gameState = 'betting';
                this.countdown = 30;
                this.currentBets = {
                    red: 0,
                    blue: 0,
                    draw: 0,
                    redStars: new Array(10).fill(0),
                    blueStars: new Array(10).fill(0)
                };
                this.selectedBets.clear();
                this.redStar = 0;
                this.blueStar = 0;
                
                // 清空星级显示
                document.getElementById('redStars').innerHTML = '';
                document.getElementById('blueStars').innerHTML = '';
                
                // 清除选中状态
                document.querySelectorAll('.bet-button, .star-bet-button').forEach(btn => {
                    btn.classList.remove('selected');
                });
                
                // 清空投注金额
                document.getElementById('redBetAmount').value = '';
                document.getElementById('blueBetAmount').value = '';
                
                // 移除获胜动画
                document.querySelectorAll('.spaceship').forEach(ship => {
                    ship.classList.remove('winner');
                });
                
                // 更新显示
                this.updateDisplay();
                
                // 开始倒计时
                this.startCountdown();
            }

            // 倒计时 - 增强音效
            startCountdown() {
                const timerElement = document.getElementById('countdownTimer');
                
                if (this.countdownInterval) {
                    clearInterval(this.countdownInterval);
                }
                
                this.countdownInterval = setInterval(() => {
                    this.countdown--;
                    
                    if (this.countdown > 0) {
                        timerElement.textContent = `投注时间: ${this.countdown}秒`;
                        timerElement.classList.remove('urgent');
                        
                        // 每5秒播放一次倒计时音效
                        if (this.countdown % 5 === 0) {
                            this.sounds.countdown();
                        }
                        
                        if (this.countdown <= 5) {
                            timerElement.classList.add('urgent');
                            // 最后3秒播放紧急倒计时音效
                            if (this.countdown <= 3) {
                                this.sounds.countdownUrgent();
                            }
                        }
                    } else {
                        clearInterval(this.countdownInterval);
                        this.startGame();
                    }
                }, 1000);
            }

            // 开始游戏
            startGame() {
                this.gameState = 'showing';
                document.getElementById('countdownTimer').textContent = '游戏进行中...';
                
                // 计算星级
                this.calculateStars();
                
                // 显示星级动画
                this.showStarsAnimation();
            }

            // 投注
            placeBet(type) {
                if (this.gameState !== 'betting') return;
                
                const betKey = type === 'red' ? 'redBetAmount' : type === 'blue' ? 'blueBetAmount' : 'drawBetAmount';
                let amount = 0;
                
                if (type === 'draw') {
                    amount = parseInt(prompt('请输入平局投注金额:') || '0');
                } else {
                    amount = parseInt(document.getElementById(betKey).value || '0');
                }
                
                if (amount <= 0) {
                    this.showMessage('请输入有效的投注金额');
                    return;
                }
                
                if (amount > this.userPoints) {
                    this.showMessage(`积分不足！当前积分：${this.userPoints}`);
                    return;
                }
                
                this.currentBets[type] = amount;
                this.selectedBets.add(type);
                
                // 更新按钮状态
                const buttonId = type + 'Bet';
                document.getElementById(buttonId).classList.add('selected');
                
                this.updateDisplay();
                this.sounds.bet();
            }

            // 星级投注
            placeStarBet(star, color) {
                if (this.gameState !== 'betting') return;
                
                const amount = parseInt(prompt(`请输入${color === 'red' ? '红方' : '蓝方'}${star}星投注金额:`) || '0');
                
                if (amount <= 0) {
                    this.showMessage('请输入有效的投注金额');
                    return;
                }
                
                if (amount > this.userPoints) {
                    this.showMessage(`积分不足！当前积分：${this.userPoints}`);
                    return;
                }
                
                this.currentBets[color + 'Stars'][star - 1] = amount;
                this.selectedBets.add(`${color}Star${star}`);
                
                // 更新按钮状态
                document.querySelector(`.star-bet-button[data-star="${star}"][data-color="${color}"]`).classList.add('selected');
                
                this.updateDisplay();
                this.sounds.bet();
            }

            // 计算星级
            calculateStars() {
                // 红方随机1-10星
                this.redStar = Math.floor(Math.random() * 10) + 1;
                
                // 蓝方概率调整，控制平局率约5%
                if (Math.random() < 0.05) {
                    // 5%概率平局
                    this.blueStar = this.redStar;
                } else {
                    // 95%概率产生不同结果
                    do {
                        this.blueStar = Math.floor(Math.random() * 10) + 1;
                    } while (this.blueStar === this.redStar);
                }
            }

            // 显示星级动画 - 增强音效
            showStarsAnimation() {
                // 显示红方星级
                this.displayStars('red', this.redStar, () => {
                    // 显示蓝方星级
                    setTimeout(() => {
                        this.displayStars('blue', this.blueStar, () => {
                            // 结算
                            setTimeout(() => this.settleGame(), 1000);
                        });
                    }, 500);
                });
            }

            // 显示星级 - 增强音效
            displayStars(color, count, callback) {
                const container = document.getElementById(color + 'Stars');
                container.innerHTML = '';
                
                let index = 0;
                const interval = setInterval(() => {
                    if (index < count) {
                        const star = document.createElement('span');
                        star.className = 'star-icon';
                        star.textContent = '⭐';
                        star.style.animationDelay = `${index * 0.1}s`;
                        container.appendChild(star);
                        
                        // 播放星级音效
                        this.sounds.star();
                        
                        index++;
                    } else {
                        clearInterval(interval);
                        if (callback) callback();
                    }
                }, 200);
            }

            // 结算游戏
            settleGame() {
                this.gameState = 'result';
                
                let winner = '';
                let profit = 0;
                let details = [];
                
                // 判断胜负
                if (this.redStar > this.blueStar) {
                    winner = 'red';
                    document.getElementById('redSpaceship').classList.add('winner');
                } else if (this.blueStar > this.redStar) {
                    winner = 'blue';
                    document.getElementById('blueSpaceship').classList.add('winner');
                } else {
                    winner = 'draw';
                }
                
                // 计算收益
                // 主投注结算
                if (this.currentBets.red > 0) {
                    if (winner === 'red') {
                        profit += this.currentBets.red * 0.95;
                        details.push(`红方投注: +${(this.currentBets.red * 0.95).toFixed(0)}`);
                    } else {
                        profit -= this.currentBets.red;
                        details.push(`红方投注: -${this.currentBets.red}`);
                    }
                }
                
                if (this.currentBets.blue > 0) {
                    if (winner === 'blue') {
                        profit += this.currentBets.blue * 0.95;
                        details.push(`蓝方投注: +${(this.currentBets.blue * 0.95).toFixed(0)}`);
                    } else {
                        profit -= this.currentBets.blue;
                        details.push(`蓝方投注: -${this.currentBets.blue}`);
                    }
                }
                
                if (this.currentBets.draw > 0) {
                    if (winner === 'draw') {
                        profit += this.currentBets.draw * 9.5;
                        details.push(`平局投注: +${(this.currentBets.draw * 9.5).toFixed(0)}`);
                    } else {
                        profit -= this.currentBets.draw;
                        details.push(`平局投注: -${this.currentBets.draw}`);
                    }
                }
                
                // 红方星级投注结算
                this.currentBets.redStars.forEach((amount, index) => {
                    if (amount > 0) {
                        const star = index + 1;
                        if (this.redStar === star) {
                            profit += amount * 9.5;
                            details.push(`红方${star}星: +${(amount * 9.5).toFixed(0)}`);
                        } else {
                            profit -= amount;
                            details.push(`红方${star}星: -${amount}`);
                        }
                    }
                });
                
                // 蓝方星级投注结算
                this.currentBets.blueStars.forEach((amount, index) => {
                    if (amount > 0) {
                        const star = index + 1;
                        if (this.blueStar === star) {
                            profit += amount * 9.5;
                            details.push(`蓝方${star}星: +${(amount * 9.5).toFixed(0)}`);
                        } else {
                            profit -= amount;
                            details.push(`蓝方${star}星: -${amount}`);
                        }
                    }
                });
                
                // 更新积分
                this.userPoints += profit;
                
                // 保存游戏记录
                const gameRecord = {
                    round: this.gameHistory.length + 1,
                    redStar: this.redStar,
                    blueStar: this.blueStar,
                    winner: winner,
                    timestamp: new Date().toISOString()
                };
                this.saveGameRecord(gameRecord);
                
                // 显示结果
                this.showResult(winner, profit, details);
            }

            // 保存游戏记录
            saveGameRecord(gameData) {
                // 预留API调用
                try {
                    // await fetch(this.apiConfig.baseUrl + this.apiConfig.endpoints.saveGame, {
                    //     method: 'POST',
                    //     headers: { 'Content-Type': 'application/json' },
                    //     body: JSON.stringify(gameData)
                    // });
                    
                    // 本地存储
                    this.gameHistory.unshift(gameData);
                    if (this.gameHistory.length > 10) {
                        this.gameHistory = this.gameHistory.slice(0, 10);
                    }
                    this.saveGameHistory();
                } catch (error) {
                    console.log('本地保存游戏记录');
                }
            }

            // 加载游戏历史
            loadGameHistory() {
                const saved = localStorage.getItem('spaceGameHistory');
                return saved ? JSON.parse(saved) : [];
            }

            // 保存游戏历史
            saveGameHistory() {
                localStorage.setItem('spaceGameHistory', JSON.stringify(this.gameHistory));
            }

            // 显示结果 - 增强音效
            showResult(winner, profit, details) {
                const modal = document.getElementById('resultModal');
                const title = document.getElementById('resultTitle');
                const detailsEl = document.getElementById('resultDetails');
                const profitEl = document.getElementById('resultProfit');
                
                // 设置标题
                if (winner === 'red') {
                    title.textContent = '🔴 红方获胜！';
                } else if (winner === 'blue') {
                    title.textContent = '🔵 蓝方获胜！';
                } else {
                    title.textContent = '🤝 平局！';
                }
                
                // 设置详情
                detailsEl.innerHTML = `
                    红方: ${this.redStar}⭐ vs 蓝方: ${this.blueStar}⭐<br>
                    ${details.join('<br>')}
                `;
                
                // 设置收益
                if (profit > 0) {
                    profitEl.textContent = `+${profit.toFixed(0)} 积分`;
                    profitEl.className = 'result-profit win';
                    this.sounds.win();
                } else if (profit < 0) {
                    profitEl.textContent = `${profit.toFixed(0)} 积分`;
                    profitEl.className = 'result-profit lose';
                    this.sounds.lose();
                } else {
                    profitEl.textContent = '0 积分';
                    profitEl.className = 'result-profit';
                }
                
                // 显示弹窗
                modal.classList.add('show');
                
                // 更新显示
                this.updateDisplay();
            }

            // 显示趋势弹窗
            showTrendModal() {
                const modal = document.getElementById('trendModal');
                modal.classList.add('show');
                this.drawTrendChart();
                this.updateStatistics();
            }

            // 绘制3D趋势图
            drawTrendChart() {
                const canvas = document.getElementById('trendChart');
                const ctx = canvas.getContext('2d');
                
                // 清空画布
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                if (this.gameHistory.length === 0) {
                    ctx.fillStyle = 'white';
                    ctx.font = '20px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('暂无游戏数据', canvas.width / 2, canvas.height / 2);
                    return;
                }
                
                // 设置3D效果参数
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const radius = Math.min(canvas.width, canvas.height) * 0.3;
                
                // 绘制3D坐标轴
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 2;
                
                // X轴
                ctx.beginPath();
                ctx.moveTo(50, canvas.height - 50);
                ctx.lineTo(canvas.width - 50, canvas.height - 50);
                ctx.stroke();
                
                // Y轴
                ctx.beginPath();
                ctx.moveTo(50, 50);
                ctx.lineTo(50, canvas.height - 50);
                ctx.stroke();
                
                // 绘制网格
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.lineWidth = 1;
                for (let i = 1; i <= 10; i++) {
                    const y = canvas.height - 50 - (i - 1) * (canvas.height - 100) / 9;
                    ctx.beginPath();
                    ctx.moveTo(50, y);
                    ctx.lineTo(canvas.width - 50, y);
                    ctx.stroke();
                }
                
                // 绘制数据点和连线
                const dataPoints = this.gameHistory.slice(0, 10).reverse();
                const stepX = (canvas.width - 100) / Math.max(dataPoints.length - 1, 1);
                
                // 红方数据线
                ctx.strokeStyle = '#ff4444';
                ctx.lineWidth = 3;
                ctx.shadowColor = '#ff4444';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                dataPoints.forEach((record, index) => {
                    const x = 50 + index * stepX;
                    const y = canvas.height - 50 - (record.redStar - 1) * (canvas.height - 100) / 9;
                    
                    if (index === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                });
                ctx.stroke();
                
                // 蓝方数据线
                ctx.strokeStyle = '#4444ff';
                ctx.shadowColor = '#4444ff';
                ctx.beginPath();
                dataPoints.forEach((record, index) => {
                    const x = 50 + index * stepX;
                    const y = canvas.height - 50 - (record.blueStar - 1) * (canvas.height - 100) / 9;
                    
                    if (index === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                });
                ctx.stroke();
                
                // 绘制数据点
                ctx.shadowBlur = 0;
                dataPoints.forEach((record, index) => {
                    const x = 50 + index * stepX;
                    const redY = canvas.height - 50 - (record.redStar - 1) * (canvas.height - 100) / 9;
                    const blueY = canvas.height - 50 - (record.blueStar - 1) * (canvas.height - 100) / 9;
                    
                    // 红方点
                    ctx.fillStyle = '#ff4444';
                    ctx.beginPath();
                    ctx.arc(x, redY, 5, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 蓝方点
                    ctx.fillStyle = '#4444ff';
                    ctx.beginPath();
                    ctx.arc(x, blueY, 5, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 期数标签
                    ctx.fillStyle = 'white';
                    ctx.font = '10px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`#${dataPoints.length - index}`, x, canvas.height - 30);
                });
                
                // 图例
                ctx.fillStyle = '#ff4444';
                ctx.fillRect(canvas.width - 150, 20, 15, 15);
                ctx.fillStyle = 'white';
                ctx.font = '12px Arial';
                ctx.textAlign = 'left';
                ctx.fillText('红方', canvas.width - 130, 32);
                
                ctx.fillStyle = '#4444ff';
                ctx.fillRect(canvas.width - 150, 45, 15, 15);
                ctx.fillStyle = 'white';
                ctx.fillText('蓝方', canvas.width - 130, 57);
            }

            // 更新统计信息
            updateStatistics() {
                const statsContainer = document.getElementById('statistics');
                
                if (this.gameHistory.length === 0) {
                    statsContainer.innerHTML = '<div class="stat-card"><div class="stat-value">0</div><div class="stat-label">总局数</div></div>';
                    return;
                }
                
                const redWins = this.gameHistory.filter(g => g.winner === 'red').length;
                const blueWins = this.gameHistory.filter(g => g.winner === 'blue').length;
                const draws = this.gameHistory.filter(g => g.winner === 'draw').length;
                
                // 计算最常见的星级
                const starCounts = {};
                for (let i = 1; i <= 10; i++) {
                    starCounts[i] = 0;
                }
                
                this.gameHistory.forEach(record => {
                    starCounts[record.redStar]++;
                    starCounts[record.blueStar]++;
                });
                
                const mostCommonStar = Object.keys(starCounts).reduce((a, b) => 
                    starCounts[a] > starCounts[b] ? a : b
                );
                
                statsContainer.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-value">${this.gameHistory.length}</div>
                        <div class="stat-label">总局数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${redWins}</div>
                        <div class="stat-label">红方获胜</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${blueWins}</div>
                        <div class="stat-label">蓝方获胜</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${draws}</div>
                        <div class="stat-label">平局</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${mostCommonStar}⭐</div>
                        <div class="stat-label">最常见星级</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${(redWins / this.gameHistory.length * 100).toFixed(1)}%</div>
                        <div class="stat-label">红方胜率</div>
                    </div>
                `;
            }

            // 更新显示
            updateDisplay() {
                document.getElementById('userPoints').textContent = this.userPoints.toFixed(0);
                
                const totalBets = this.currentBets.red + this.currentBets.blue + 
                                 this.currentBets.draw + 
                                 this.currentBets.redStars.reduce((a, b) => a + b, 0) +
                                 this.currentBets.blueStars.reduce((a, b) => a + b, 0);
                document.getElementById('currentBets').textContent = totalBets;
            }

            // 显示消息
            showMessage(message) {
                const toast = document.createElement('div');
                toast.style.cssText = `
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    background: rgba(0, 0, 0, 0.9);
                    color: white;
                    padding: 20px 40px;
                    border-radius: 10px;
                    font-size: 1.2em;
                    z-index: 2000;
                    animation: fadeIn 0.3s;
                    border: 2px solid rgba(255, 255, 255, 0.3);
                    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
                `;
                toast.textContent = message;
                document.body.appendChild(toast);
                
                // 播放提示音效
                this.sounds.click();
                
                setTimeout(() => {
                    toast.style.animation = 'fadeOut 0.3s';
                    setTimeout(() => toast.remove(), 300);
                }, 2000);
            }
        }

        // 启动游戏
        document.addEventListener('DOMContentLoaded', () => {
            const game = new SpaceChallengeGame();
            
            // 添加全局API接口，方便后续集成
            window.SpaceGameAPI = {
                // 设置用户信息
                setUserInfo: (userId, points) => {
                    game.userId = userId;
                    game.userPoints = points;
                    game.updateDisplay();
                },
                
                // 获取游戏数据
                getGameData: () => {
                    return {
                        userId: game.userId,
                        points: game.userPoints,
                        gameHistory: game.gameHistory,
                        currentBets: game.currentBets
                    };
                },
                
                // 手动更新积分
                updatePoints: (points) => {
                    game.userPoints = points;
                    game.updateDisplay();
                }
            };
        });
    </script>
</body>
</html>
